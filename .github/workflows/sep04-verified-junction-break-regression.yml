name: September 04 Verified Junction Break Regression

on:
  pull_request:
    paths:
      - 'src/CE.Tools.Core/PlanJunctionPlanner.cs'
      - 'src/CE.Tools.Civil3D/September04VerifiedJunctionBreakRuntime.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August25CadSupplementaryBreakEngine.cs'
      - 'scripts/Repair-September04-VerifiedJunctionBreak-Civil3D2023.ps1'
      - 'scripts/Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - 'tests/CE.Tools.PlanJunction.Tests/**'
      - '.github/workflows/sep04-verified-junction-break-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Core/PlanJunctionPlanner.cs'
      - 'src/CE.Tools.Civil3D/September04VerifiedJunctionBreakRuntime.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August25CadSupplementaryBreakEngine.cs'
      - 'scripts/Repair-September04-VerifiedJunctionBreak-Civil3D2023.ps1'
      - 'scripts/Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - 'tests/CE.Tools.PlanJunction.Tests/**'
      - '.github/workflows/sep04-verified-junction-break-regression.yml'

jobs:
  verified-junction-break:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run screenshot-style crossing and T-junction geometry tests
        shell: pwsh
        run: dotnet run --project tests/CE.Tools.PlanJunction.Tests/CE.Tools.PlanJunction.Tests.csproj --configuration Release

      - name: Apply historical then final field junction boundaries
        shell: powershell
        run: |
          .\scripts\Repair-September04-VerifiedJunctionBreak-Civil3D2023.ps1 -RepoRoot .
          .\scripts\Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1 -RepoRoot .

      - name: Verify final tracked and staged command route
        shell: pwsh
        run: |
          $engine = Get-Content -Raw src/CE.Tools.Civil3D/August25CadSupplementaryBreakEngine.cs
          $runtime = Get-Content -Raw src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs
          $targets = Get-Content -Raw Directory.Build.targets
          if (-not $engine.Contains('September04FieldGeometryCompletionCommands.BreakAtJunctions(document);')) { throw 'Native keep-source runtime is not the final command route.' }
          foreach ($token in @('source.GetSplitCurves(splitPoints)','CollectCrossings(','CollectEndpointTJunctions(','ReplacePolylineGeometry(source, pieces[0]);')) {
            if (-not $runtime.Contains($token)) { throw "Final T/X runtime marker missing: $token" }
          }
          if ($runtime.Contains('source.Erase()')) { throw 'Final T/X runtime contains a source erase route.' }
          if (-not $targets.Contains('AfterTargets="CEApplySeptember04SiteGridDynamicNoLoop"')) { throw 'September 05 field geometry target is not the absolute final boundary.' }

      - name: Parse final staged C# source
        shell: pwsh
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj --configuration Release
