name: Fix production report popup literals

on:
  pull_request:
    branches:
      - agent/fix-sewer-alignment-project-production-popups

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sewer-alignment-project-production-popups
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/Fix-ProductionReportPopupLiterals.py
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/ProductionReportCommands.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix drawing book popup status literals"
          git push origin HEAD:agent/fix-sewer-alignment-project-production-popups
