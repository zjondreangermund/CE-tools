name: Apply Undo Group Pollution Hotfix

on:
  push:
    branches:
      - hotfix/undo-group-pollution
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/undo-group-pollution
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply undo-stack hotfix
        run: python3 scripts/Apply-UndoGroupPollutionHotfix.py

      - name: Validate undo-stack hotfix
        run: python3 scripts/Validate-UndoGroupPollutionHotfix.py

      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse Civil 3D C# syntax
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/CeInteractionTelemetryCommands.cs \
                  src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs
          if git diff --cached --quiet; then
            echo "No source hotfix changes remain."
            exit 0
          fi
          git commit -m "Prevent CE background writes from polluting AutoCAD undo"
          git push origin HEAD:hotfix/undo-group-pollution
