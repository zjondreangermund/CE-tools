name: August 26 CAD Supplementary Geometry Safety

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August26CadSupplementaryFieldRuntime.cs'
      - 'src/CE.Tools.Civil3D/August26CadSupplementaryBreakReplacement.cs'
      - 'src/CE.Tools.Civil3D/August25CadSupplementaryBreakEngine.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August24FieldGeometryCommands.cs'
      - 'scripts/Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1'
      - 'scripts/Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/aug26-cad-supplementary-geometry-safety.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August26CadSupplementaryFieldRuntime.cs'
      - 'src/CE.Tools.Civil3D/August26CadSupplementaryBreakReplacement.cs'
      - 'src/CE.Tools.Civil3D/August25CadSupplementaryBreakEngine.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August24FieldGeometryCommands.cs'
      - 'scripts/Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1'
      - 'scripts/Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/aug26-cad-supplementary-geometry-safety.yml'

jobs:
  field-safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify August 26 build boundary still exists
        shell: pwsh
        run: |
          $targets = Get-Content -Raw Directory.Build.targets
          foreach ($token in @('CEApplyAugust26CadSupplementaryGeometrySafety','AfterTargets="CEApplyAugust25CadSupplementaryFieldMultiSelect"','Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1')) {
            if (-not $targets.Contains($token)) { throw "August 26 build marker missing: $token" }
          }

      - name: Stage August 25 and August 26 boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-aug26-cad-supplementary'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src -Destination $stage -Recurse -Force
          Copy-Item scripts -Destination $stage -Recurse -Force
          Copy-Item tests -Destination $stage -Recurse -Force
          Copy-Item global.json -Destination $stage -Force
          & (Join-Path $stage 'scripts\Invoke-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1') -RepoRoot $stage
          ('STAGE=' + $stage) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify close stretch offset and centre routes
        shell: pwsh
        run: |
          $geometry = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August24FieldGeometryCommands.cs')
          foreach ($token in @('August26CadSupplementaryFieldRuntime.CloseOpenMultiple(document);','August26CadSupplementaryFieldRuntime.StretchFeatureLines(document);','August26CadSupplementaryFieldRuntime.ConstructionOffsets(document);','August26CadSupplementaryFieldRuntime.MiddleConstructionLines(document);')) {
            if (-not $geometry.Contains($token)) { throw "August 26 staged geometry route missing: $token" }
          }
          $runtime = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August26CadSupplementaryFieldRuntime.cs')
          foreach ($token in @('FeatureLinePointType.PIPoint','featureLine.GetGripPoints','featureLine.MoveGripPointsAt','featureLine.MoveStretchPointsAt','MergeCollinearSections','JoinZeroFillet')) {
            if (-not $runtime.Contains($token)) { throw "August 26 runtime marker missing: $token" }
          }

      - name: Verify Break uses a recognized guarded runtime
        shell: pwsh
        run: |
          $engine = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August25CadSupplementaryBreakEngine.cs')
          $aug26 = $engine.Contains('August26CadSupplementaryBreakReplacement.TryReplaceBatch')
          $sep04 = $engine.Contains('September04VerifiedJunctionBreakRuntime.BreakPolylinesAtJunctions(document);')
          $sep05 = $engine.Contains('September04FieldGeometryCompletionCommands.BreakAtJunctions(document);')
          if (-not $aug26 -and -not $sep04 -and -not $sep05) { throw 'Break engine is not using a recognized guarded runtime.' }

          if ($sep04) {
            $runtime = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\September04VerifiedJunctionBreakRuntime.cs')
            if ($runtime.Contains('.Erase(')) { throw 'September 04 keep-source runtime contains an erase route.' }
          }
          if ($sep05) {
            $runtime = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\September04FieldGeometryCompletionCommands.cs')
            foreach ($token in @('source.GetSplitCurves(splitPoints)','CollectCrossings(','CollectEndpointTJunctions(','ReplacePolylineGeometry(source, pieces[0]);')) {
              if (-not $runtime.Contains($token)) { throw "September 05 native Break marker missing: $token" }
            }
            if ($runtime.Contains('source.Erase()')) { throw 'September 05 native keep-source runtime contains an erase route.' }
          }

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
