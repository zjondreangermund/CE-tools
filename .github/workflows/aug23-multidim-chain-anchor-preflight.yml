name: August 23 Multi Dimensions Chain Anchor Preflight

on:
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'scripts/Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1'
      - 'scripts/Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1'
      - '.github/workflows/aug23-multidim-chain-anchor-preflight.yml'

jobs:
  staged-chain-anchor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce late staged Multi Dimensions declaration layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'
          $text = [IO.File]::ReadAllText($path) -replace "`r?`n","`r`n"
          $leader = @'
            double leader = PaperAnnotationScale.ModelDistance(
                document.Database,
                settings.Double("ArcLeader", 6.0));
'@ -replace "`r?`n","`r`n"
          $leader = $leader.TrimEnd("`r","`n")
          $sources = '            int sources = 0;'
          $leaderIndex = $text.IndexOf($leader,[StringComparison]::Ordinal)
          $sourcesIndex = $text.IndexOf($sources,$leaderIndex + $leader.Length,[StringComparison]::Ordinal)
          if ($leaderIndex -lt 0 -or $sourcesIndex -lt 0) { throw 'Raw chain anchors missing.' }
          $probe = @'
            bool outputMillimetres = string.Equals(
                "Millimetres",
                "Millimetres",
                StringComparison.OrdinalIgnoreCase);
            double measurementFactor = outputMillimetres ? 1000.0 : 1.0;
            double latePresentationProbe = 42.0;

'@ -replace "`r?`n","`r`n"
          $text = $text.Insert($sourcesIndex,$probe)
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

      - name: Run preflight then preserved August 21 finalizer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\scripts\Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1" -RepoRoot $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1" -RepoRoot $env:GITHUB_WORKSPACE

      - name: Verify chain dispatch and late declarations coexist
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'
          $text = [IO.File]::ReadAllText($path)
          foreach ($required in @(
            'const string chain = "Chain - between multiple open polylines";',
            'if (string.Equals(mode, chain, StringComparison.OrdinalIgnoreCase))',
            'private static void DimensionOpenPolylineChain(',
            'double measurementFactor = outputMillimetres ? 1000.0 : 1.0;',
            'double latePresentationProbe = 42.0;')) {
            if (-not $text.Contains($required)) { throw "Missing final marker: $required" }
          }

      - name: Run preflight and finalizer a second time
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\scripts\Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1" -RepoRoot $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\scripts\Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1" -RepoRoot $env:GITHUB_WORKSPACE

      - name: Parse repaired PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "$env:GITHUB_WORKSPACE\scripts\Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1",
            "$env:GITHUB_WORKSPACE\scripts\Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
