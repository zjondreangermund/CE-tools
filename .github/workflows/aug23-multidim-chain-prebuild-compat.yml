name: August 23 Multi Dimensions Chain Prebuild Compatibility

on:
  pull_request:
    paths:
      - 'Directory.Build.props'
      - 'scripts/Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
      - 'scripts/Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1'
      - 'scripts/Repair-August20-MultiDimensionCircleUnitsAndProperties-Civil3D2023.ps1'
      - 'scripts/Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1'
      - '.github/workflows/aug23-multidim-chain-prebuild-compat.yml'

jobs:
  reproduce-chain-anchor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create staged source with late declarations and non-canonical chain dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'
          $text = [IO.File]::ReadAllText($path) -replace "`r?`n","`r`n"
          $old = @'
            double leader = PaperAnnotationScale.ModelDistance(
                document.Database,
                settings.Double("ArcLeader", 6.0));

            int sources = 0;
'@ -replace "`r?`n","`r`n"
          $new = @'
            double leader = PaperAnnotationScale.ModelDistance(
                document.Database,
                settings.Double("ArcLeader", 6.0));
            bool outputMillimetres = string.Equals(
                settings.Text("ValueUnits"),
                "Millimetres",
                StringComparison.OrdinalIgnoreCase);
            double measurementFactor = outputMillimetres ? 1000.0 : 1.0;
            double latePresentationProbe = 42.0;

            if (string.Equals(mode, chain, StringComparison.OrdinalIgnoreCase))
            {
                // Earlier staged repair emitted the same dispatch with different formatting.
                DimensionOpenPolylineChain(document, selection, requestedStyle);
                return;
            }

            int sources = 0;
'@ -replace "`r?`n","`r`n"
          if (-not $text.Contains($old)) { throw 'Raw ArcLeader/sources anchor missing.' }
          $text = $text.Replace($old,$new)
          [IO.File]::WriteAllText($path,$text,(New-Object Text.UTF8Encoding($false)))

      - name: Run chain-anchor preflight then final pre-build boundary twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($pass = 1; $pass -le 2; $pass++) {
            & "$env:GITHUB_WORKSPACE\scripts\Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1" -RepoRoot $env:GITHUB_WORKSPACE
            & "$env:GITHUB_WORKSPACE\scripts\Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1" -RepoRoot $env:GITHUB_WORKSPACE
          }

      - name: Verify one canonical chain dispatch and preserved late declarations
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'
          $text = [IO.File]::ReadAllText($path)
          foreach ($required in @(
            'const string chain = "Chain - between multiple open polylines";',
            'if (string.Equals(mode, chain, StringComparison.OrdinalIgnoreCase))',
            'private static void DimensionOpenPolylineChain(',
            'double measurementFactor = outputMillimetres ? 1000.0 : 1.0;',
            'double latePresentationProbe = 42.0;')) {
            if (-not $text.Contains($required)) { throw "Missing: $required" }
          }
          $dispatch = 'if (string.Equals(mode, chain, StringComparison.OrdinalIgnoreCase))'
          if (($text.Split(@($dispatch),[StringSplitOptions]::None).Count - 1) -ne 1) {
            throw 'Expected exactly one final chain dispatch.'
          }
          if ($text.Contains('Earlier staged repair emitted the same dispatch')) {
            throw 'Non-canonical staged dispatch was not structurally replaced.'
          }

      - name: Parse preflight PowerShell syntax
        shell: pwsh
        run: |
          $file = "$env:GITHUB_WORKSPACE\scripts\Repair-August23-MultiDimensionChainAnchorPreflight-Civil3D2023.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
