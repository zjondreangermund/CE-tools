name: August 18 Site Grid Repair Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/Repair-August17-ProjectProductionComments-Civil3D2023.ps1'
      - 'scripts/Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs'
      - 'src/CE.Tools.Civil3D/AugustAutomaticRefreshManager.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug23-aug18-sitegrid-repair-compat-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/Repair-August17-ProjectProductionComments-Civil3D2023.ps1'
      - 'scripts/Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs'
      - 'src/CE.Tools.Civil3D/AugustAutomaticRefreshManager.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug23-aug18-sitegrid-repair-compat-regression.yml'

jobs:
  execute-aug18-repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse staged repair scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'Repair-August17-ProjectProductionComments-Civil3D2023.ps1',
            'Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE ('scripts\' + $name)
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw (($errors | ForEach-Object { $name + ' line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
            }
          }

      - name: Apply prerequisite August 17 Project Production repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-August17-ProjectProductionComments-Civil3D2023.ps1') -RepoRoot $env:GITHUB_WORKSPACE

      - name: Execute August 18 repair in staged order
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1') -RepoRoot $env:GITHUB_WORKSPACE

      - name: Verify Site Grid display refresh and loop guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August12SurveySiteGridCommands.cs'
          $text = [System.IO.File]::ReadAllText($path)
          foreach ($marker in @(
            'internal static bool IsLinkedSiteGridObject(',
            'internal static void AcknowledgeCurrentState()',
            'dirty.RemoveWhere(id =>',
            '_document.Database.DisableUndoRecording(true);',
            '_document.Database.DisableUndoRecording(false);',
            'August21DisplayRefresh.Flush(document);',
            'August21DisplayRefresh.Flush(_document);')) {
            if (-not $text.Contains($marker)) { throw "Site Grid repaired marker missing: $marker" }
          }
          if ($text.Contains('document.Editor.Regen();') -or $text.Contains('_document.Editor.Regen();')) {
            throw 'August 18 repair regressed Site Grid to Editor.Regen().'
          }
          Write-Host 'August 18 staged repair accepts the current display-flush source and preserves loop/Undo guards.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse repaired Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .
