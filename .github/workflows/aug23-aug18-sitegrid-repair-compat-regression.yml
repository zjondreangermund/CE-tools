name: August 18 Site Grid Repair Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs'
      - 'src/CE.Tools.Civil3D/AugustAutomaticRefreshManager.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug23-aug18-sitegrid-repair-compat-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs'
      - 'src/CE.Tools.Civil3D/AugustAutomaticRefreshManager.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug23-aug18-sitegrid-repair-compat-regression.yml'

jobs:
  execute-aug18-repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse staged repair scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Filter '*.ps1' -File | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw (($errors | ForEach-Object { $_.Name + ' line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
            }
          }

      - name: Reproduce Stage-Build source transforms through August 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Restore-V60-ChunkedSources is intentionally omitted here. It is only a
          # recovery fallback and does not overwrite the active sources when they
          # are present; GitHub's hosted PowerShell cannot expand one legacy ZIP
          # compression method. All active-source transforms below retain the exact
          # Stage-Build-Install-Civil3D2023.ps1 order.
          $scripts = @(
            'Repair-Civil3D2023-Compatibility.ps1',
            'Repair-V60-RemainingCompatibility.ps1',
            'Inject-ProductionExpansion-Civil3D2023.ps1',
            'Inject-August10BehaviorFixes-Civil3D2023.ps1',
            'Inject-FinalAnnotationReview2-Civil3D2023.ps1',
            'Inject-FinalUtilityWorkflow-Civil3D2023.ps1',
            'Repair-CogoOverlap-Civil3D2023.ps1',
            'Repair-RoadStyleFallback-Civil3D2023.ps1',
            'Repair-BranchLabelRefresh-Civil3D2023.ps1',
            'Repair-MidblockRoutePlanner-Civil3D2023.ps1',
            'Repair-ProfileStyleAutoImport-Civil3D2023.ps1',
            'Repair-UtilityProfileIsolation-Civil3D2023.ps1',
            'Repair-August10-CompilerErrors-Civil3D2023.ps1',
            'Inject-August11FieldCompletion-Civil3D2023.ps1',
            'Repair-August11-FieldCompilerCompatibility-Civil3D2023.ps1',
            'Repair-GlobalInterfaceAndStylePersistence-Civil3D2023.ps1',
            'Repair-August12PersistentProductionUi-Civil3D2023.ps1',
            'Repair-August17-ProjectProductionComments-Civil3D2023.ps1'
          )
          foreach ($name in $scripts) {
            Write-Host "Applying staged prerequisite: $name" -ForegroundColor Cyan
            & (Join-Path $env:GITHUB_WORKSPACE ('scripts\' + $name)) -RepoRoot $env:GITHUB_WORKSPACE
            $global:LASTEXITCODE = 0
          }

      - name: Verify reproduced pre-August18 Site Grid state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August12SurveySiteGridCommands.cs'
          $text = [System.IO.File]::ReadAllText($path)
          foreach ($marker in @(
            'internal static bool IsLinkedSiteGridObject(',
            'internal static void AcknowledgeCurrentState()',
            'dirty.RemoveWhere(id =>',
            '_document.Database.DisableUndoRecording(true);')) {
            if (-not $text.Contains($marker)) { throw "Staged prerequisite Site Grid marker missing: $marker" }
          }
          if (-not $text.Contains('August21DisplayRefresh.Flush(document);')) {
            throw 'Staged source did not preserve the PR #110 display-flush state.'
          }
          Write-Host 'Reproduced the staged Site Grid state immediately before the August 18 repair.' -ForegroundColor Green

      - name: Execute August 18 repair exactly where installer failed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1') -RepoRoot $env:GITHUB_WORKSPACE

      - name: Verify Site Grid display refresh and loop guards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August12SurveySiteGridCommands.cs'
          $text = [System.IO.File]::ReadAllText($path)
          foreach ($marker in @(
            'internal static bool IsLinkedSiteGridObject(',
            'internal static void AcknowledgeCurrentState()',
            'dirty.RemoveWhere(id =>',
            '_document.Database.DisableUndoRecording(true);',
            '_document.Database.DisableUndoRecording(false);',
            'August12SiteGridRuntimeManager.AcknowledgeCurrentState();',
            'August21DisplayRefresh.Flush(document);',
            'August21DisplayRefresh.Flush(_document);')) {
            if (-not $text.Contains($marker)) { throw "Site Grid repaired marker missing: $marker" }
          }
          if ($text.Contains('document.Editor.Regen();') -or $text.Contains('_document.Editor.Regen();')) {
            throw 'August 18 repair regressed Site Grid to Editor.Regen().'
          }
          Write-Host 'Exact staged August 18 Site Grid repair passed without restoring REGEN or Undo pollution.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse repaired Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .
