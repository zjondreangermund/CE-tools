name: September 04 XLINE junction regression

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stage final field routes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Invoke-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1 -RepoRoot .
          & .\scripts\Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1 -RepoRoot .
          & .\scripts\Repair-August27-DynamicSlopeGridHatch-Civil3D2023.ps1 -RepoRoot .
          & .\scripts\Repair-September04-ConstructionXlineBreakJunctions-Civil3D2023.ps1 -RepoRoot .

      - name: Verify XLINE and keep-polyline markers
        shell: pwsh
        run: |
          $runtime = [System.IO.File]::ReadAllText('src\CE.Tools.Civil3D\September04CadSupplementaryRuntime.cs')
          if (-not $runtime.Contains('new Xline()')) { throw 'XLINE creation missing.' }
          if (-not $runtime.Contains('xline.BasePoint =')) { throw 'XLINE base point missing.' }
          if (-not $runtime.Contains('xline.UnitDir =')) { throw 'XLINE direction missing.' }
          if (-not $runtime.Contains('CollectEndpointTJunctions')) { throw 'T-junction analysis missing.' }
          if (-not $runtime.Contains('CollectPlanStraightIntersections')) { throw 'X-crossing plan analysis missing.' }
          if (-not $runtime.Contains('ReplacePolylineGeometry(source, pieces[0]);')) { throw 'Keep-source split missing.' }
          if ($runtime.Contains('source.Erase()')) { throw 'Source polyline erase is forbidden.' }
          $field = [System.IO.File]::ReadAllText('src\CE.Tools.Civil3D\August24FieldGeometryCommands.cs')
          if (-not $field.Contains('September04CadSupplementaryRuntime.ConstructionOffsets(document);')) { throw 'Construction offset route missing.' }
          if (-not $field.Contains('September04CadSupplementaryRuntime.MiddleConstructionLines(document);')) { throw 'Centre XLINE route missing.' }
          $break = [System.IO.File]::ReadAllText('src\CE.Tools.Civil3D\August25CadSupplementaryBreakEngine.cs')
          if (-not $break.Contains('September04CadSupplementaryRuntime.BreakPolylinesAtJunctions(document);')) { throw 'Break route missing.' }

      - name: Parse staged C sharp syntax
        shell: pwsh
        run: dotnet run --project tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .
