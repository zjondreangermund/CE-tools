name: August 11 Field Completion Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/**'
      - 'scripts/*.ps1'
      - 'scripts/*.py'
      - '.github/workflows/august11-field-completion-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/**'
      - 'scripts/*.ps1'
      - 'scripts/*.py'
      - '.github/workflows/august11-field-completion-validation.yml'

jobs:
  staged-source-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy repository to disposable validation folder
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'CE-Tools-Current-Field-Validation'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          robocopy $env:GITHUB_WORKSPACE $stage /E /XD .git .vs bin obj artifacts /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          "CE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Parse every CE Tools PowerShell helper
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:CE_STAGE 'scripts') -Filter '*.ps1' -File | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $message = ($errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }) -join ' | '
              throw "PowerShell parse error in $($_.Name): $message"
            }
            $text = [System.IO.File]::ReadAllText($_.FullName)
            if ([regex]::IsMatch($text,'(?im)^\s*elif\s*\(')) {
              throw "Invalid Python-style 'elif' found in PowerShell file $($_.Name)."
            }
          }

      - name: Reproduce Site Grid Append field-recovery compatibility
        shell: pwsh
        run: |
          $siteGrid = Join-Path $env:CE_STAGE 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
          $compat = Join-Path $env:CE_STAGE 'scripts/Repair-August21-SiteGridAppendCompatibility-Civil3D2023.ps1'
          $fieldRecovery = Join-Path $env:CE_STAGE 'scripts/Repair-August20-FieldRecoveryPass-Civil3D2023.ps1'
          foreach ($required in @($siteGrid,$compat,$fieldRecovery)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Site Grid compatibility validation prerequisite missing: $required"
            }
          }

          $before = [System.IO.File]::ReadAllText($siteGrid)
          if (-not $before.Contains('private static void Append(') -and
              -not $before.Contains('private static ObjectId Append(')) {
            throw 'Site Grid validation could not locate either supported Append helper shape.'
          }

          & $compat -RepoRoot $env:CE_STAGE
          $after = [System.IO.File]::ReadAllText($siteGrid)
          foreach ($marker in @(
            'private static ObjectId Append(',
            'ObjectId id = modelSpace.AppendEntity(entity);',
            'entity.RecordGraphicsModified(true);',
            'return id;')) {
            if (-not $after.Contains($marker)) {
              throw "Site Grid Append compatibility regression missing: $marker"
            }
          }
          if ($after.Contains('private static void Append(')) {
            throw 'Site Grid void Append helper survived compatibility normalization.'
          }

          $fieldText = [System.IO.File]::ReadAllText($fieldRecovery)
          if (-not $fieldText.Contains("ReplaceMethodBody `$site '        private static ObjectId Append('")) {
            throw 'Historical field-recovery pass no longer exposes the expected ObjectId Append marker contract.'
          }
          Write-Host 'Site Grid void/ObjectId Append compatibility contract passed.' -ForegroundColor Green

      - name: Verify preserved August 11 validation assets
        shell: pwsh
        run: |
          $required = @(
            'scripts/Inject-August11FieldCompletion-Civil3D2023.ps1',
            'scripts/Repair-August11-FieldCompilerCompatibility-Civil3D2023.ps1',
            'scripts/Validate-August11FieldCompletion.ps1',
            'scripts/Validate-August11FieldCompletion2.ps1',
            'scripts/Validate-CECommandWiring.ps1',
            'scripts/Validate-CECommandWiring.py'
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:CE_STAGE $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Preserved August 11 validation asset missing: $relative"
            }
          }
          Write-Host 'Historical August 11 repair/validation assets are still preserved.' -ForegroundColor Green

      - name: Validate current stable source gates
        shell: pwsh
        run: |
          Push-Location $env:CE_STAGE
          try {
            python scripts/Validate-ProductionCentreCommandTargets.py
            python scripts/Validate-AnnotationCommands.py
            python scripts/Validate-ReportPresentation.py
            python scripts/Validate-ReleasePipeline.py
          }
          finally {
            Pop-Location
          }

      - name: Validate current August 20 staged entry-point chain
        shell: pwsh
        run: |
          $compat = Join-Path $env:CE_STAGE 'scripts/Build-Install-Civil3D2023-August20-Compat.ps1'
          if (-not (Test-Path -LiteralPath $compat -PathType Leaf)) {
            throw 'Current August 20 compatibility build entry point is missing.'
          }
          $text = [System.IO.File]::ReadAllText($compat)
          $markers = @(
            'Repair-August20-SurveyProductionMenuPreflight.ps1',
            'Repair-August20-SewerFatalAndSiteGridVisibility-Civil3D2023.ps1',
            'Repair-August20-GeometryFirstSewerAndDynamicSiteGrid-Civil3D2023.ps1',
            'Repair-August20-MultiDimensionCircleUnitsAndProperties-Civil3D2023.ps1',
            'Repair-August20-BackgroundAndCrossDisciplineFatalSafety-Civil3D2023.ps1',
            'Repair-August21-SiteGridAppendCompatibility-Civil3D2023.ps1',
            'Repair-August20-FieldRecoveryPass-Civil3D2023.ps1',
            'Build-Install-Civil3D2023-August19.ps1'
          )
          foreach ($marker in $markers) {
            if ($text.IndexOf($marker,[System.StringComparison]::Ordinal) -lt 0) {
              throw "Current August 20 staged entry-point marker missing: $marker"
            }
          }
          $fieldStability = $text.IndexOf('& $august20FieldStability -RepoRoot $repo',[System.StringComparison]::Ordinal)
          $lateSafety = $text.IndexOf('Applying late Sewer fatal-safety and Site Grid field-visibility guard',[System.StringComparison]::Ordinal)
          $geometryFirst = $text.IndexOf('Applying geometry-first Sewer/Road Centreline workflows and dynamic Site Grid repair',[System.StringComparison]::Ordinal)
          $multiDimension = $text.IndexOf('Applying final Multiple Dimensions circle/unit/property repair',[System.StringComparison]::Ordinal)
          $crossDiscipline = $text.IndexOf('Applying final Background and cross-discipline fatal-safety repair',[System.StringComparison]::Ordinal)
          $runtimeStability = $text.IndexOf('Applying final August 20 runtime-stability/workflow pass',[System.StringComparison]::Ordinal)
          $siteGridCompat = $text.IndexOf('Normalizing Site Grid Append helper for field-recovery compatibility',[System.StringComparison]::Ordinal)
          $fieldRecovery = $text.IndexOf('Applying August 20 Civil 3D field-recovery pass',[System.StringComparison]::Ordinal)
          if ($fieldStability -lt 0 -or
              $lateSafety -le $fieldStability -or
              $geometryFirst -le $lateSafety -or
              $multiDimension -le $geometryFirst -or
              $crossDiscipline -le $multiDimension -or
              $runtimeStability -le $crossDiscipline -or
              $siteGridCompat -le $runtimeStability -or
              $fieldRecovery -le $siteGridCompat) {
            throw 'Current August 20 final staged repair order is invalid.'
          }
          Write-Host 'Current August 20 staged entry-point chain is present and ordered.' -ForegroundColor Green

      - name: Explain validation ownership
        shell: pwsh
        run: |
          Write-Host 'Historical August 11 post-injection validators are preserved but are not replayed against modern raw August 20 source.' -ForegroundColor Cyan
          Write-Host 'The real Civil 3D 2023 stage/repair/build gate remains the Civil 3D 2023 build and release package workflow on the self-hosted Civil3D2023 runner.' -ForegroundColor Cyan
