name: Temporary August 23 August18 Menu Compatibility

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/_temp-aug23-aug18-googleearth-menu-compat.yml'

permissions:
  contents: write

jobs:
  patch-aug18-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/aug23-aug18-sitegrid-repair-compat
          fetch-depth: 0

      - name: Make Google Earth menu insertion tolerant of current Survey settings shape
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '''$menuCommand = 'CE_SURVEYGOOGLEEARTHBOUNDARY'
if (-not $centres.Contains($menuCommand)) {
    $anchor = '                    A("CE-Namibia LO / WGS84 Survey Conversion", "CE_NAMIBIALO", "Convert picked/drawing WGS84 and Namibia Schwarzeck LO survey coordinates.", "01 SETTINGS"),'
    $addition = $anchor + "`r`n" +
        '                    A("CE-Plot Polyline Boundary in Google Earth", "CE_SURVEYGOOGLEEARTHBOUNDARY", "Convert one or more closed survey polylines to WGS84 KML and open the polygon boundaries in Google Earth.", "01 SETTINGS"),'
    if (-not $centres.Contains($anchor)) {
        throw 'Survey Production Namibia LO menu anchor was not found for Google Earth boundary insertion.'
    }
    $centres = $centres.Replace($anchor,$addition)
    WriteText $centresPath $centres
}'''
          new = '''$menuCommand = 'CE_SURVEYGOOGLEEARTHBOUNDARY'
if (-not $centres.Contains($menuCommand)) {
    $googleEarthAction = '                    A("CE-Plot Polyline Boundary in Google Earth", "CE_SURVEYGOOGLEEARTHBOUNDARY", "Convert one or more closed survey polylines to WGS84 KML and open the polygon boundaries in Google Earth.", "01 SETTINGS"),'
    $anchors = @(
        '                    A("CE-Namibia LO / WGS84 Survey Conversion", "CE_NAMIBIALO", "Convert picked/drawing WGS84 and Namibia Schwarzeck LO survey coordinates.", "01 SETTINGS"),',
        '                    A("CE-Survey Location / Coordinate System", "CE_SURVEYLOCATION", "Set project area and the installed Namibia LO coordinate system.", "01 SETTINGS"),'
    )
    $inserted = $false
    foreach ($anchor in $anchors) {
        if ($centres.Contains($anchor)) {
            $centres = $centres.Replace($anchor, $anchor + "`r`n" + $googleEarthAction)
            $inserted = $true
            break
        }
    }
    if (-not $inserted) {
        throw 'Survey Production location/coordinate-system menu anchor was not found for Google Earth boundary insertion.'
    }
    WriteText $centresPath $centres
}'''
          if old not in text:
              if '$googleEarthAction =' not in text:
                  raise SystemExit('Expected August 18 Google Earth menu block was not found')
          else:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Parse patched PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            throw (($errors | ForEach-Object { 'line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
          }

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-aug23-aug18-googleearth-menu-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Repair-August18-SurveyGoogleEarthAndVertexDynamics-Civil3D2023.ps1 .github/workflows/_temp-aug23-aug18-googleearth-menu-compat.yml
          git diff --cached --check
          git commit -m "fix: make August 18 Survey menu repair idempotent"
          git push origin HEAD:fix/aug23-aug18-sitegrid-repair-compat
