name: Apply Civil 3D 2023 Runtime Compile Hotfix

on:
  push:
    branches:
      - hotfix/c3d2023-runtime-completion-compile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/c3d2023-runtime-completion-compile
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reported Windows compile fixes
        run: python3 scripts/Apply-Civil3D2023RuntimeCompileHotfix.py

      - name: Validate Civil 3D 2023 compile compatibility
        run: python3 scripts/Validate-Civil3D2023CompileHotfix.py

      - name: Validate pre-build runtime completion
        run: python3 scripts/Validate-PreBuildRuntimeCompletion.py

      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse all Civil 3D C# source
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/PreBuildRuntimeCompletionCommands.cs \
                  src/CE.Tools.Civil3D/SewerNetworkDynamicSequenceManager.cs
          if git diff --cached --quiet; then
            echo "No source changes remain."
            exit 0
          fi
          git commit -m "Fix Civil 3D 2023 runtime completion compile errors"
          git push origin HEAD:hotfix/c3d2023-runtime-completion-compile
