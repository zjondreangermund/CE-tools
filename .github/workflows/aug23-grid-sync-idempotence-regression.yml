name: August 23 Grid Sync Idempotence

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'scripts/Repair-August23-SettingOutCadFeedbackIdempotence-Civil3D2023.ps1'
      - '.github/workflows/aug23-grid-sync-idempotence-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'scripts/Repair-August23-SettingOutCadFeedbackIdempotence-Civil3D2023.ps1'
      - '.github/workflows/aug23-grid-sync-idempotence-regression.yml'

jobs:
  staged-grid-sync:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staged repository copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-tools-aug23-grid-sync'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination $stage -Force
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reproduce packaged helper-present calls-missing state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August18DynamicGridSettingOutCommands.cs'
          $text = [System.IO.File]::ReadAllText($path) -replace "`r?`n", "`r`n"

          # The tester's packaged state has the August 23 SyncGridLines helper but
          # zero create/refresh calls. Raw tracked source can predate that helper,
          # so model only the helper prerequisite rather than replaying unrelated
          # historical dimension/production repairs.
          if (-not $text.Contains('private static void SyncGridLines(')) {
            $marker = '        private static ObjectId CreateCogo('
            $index = $text.IndexOf($marker,[StringComparison]::Ordinal)
            if ($index -lt 0) { throw 'CreateCogo marker missing while modelling Grid helper.' }
            $helper = @'
        private static void SyncGridLines(
            Database database,
            Transaction transaction,
            IList<GridSource> sources,
            DynamicGridLink link)
        {
            // Regression-only staged helper: the production August 23 repair owns
            // the real linked-line implementation. This models only its presence.
        }

'@ -replace "`r?`n", "`r`n"
            $text = $text.Insert($index,$helper)
          }

          $pattern = '(?m)^[ \t]*SyncGridLines\s*\(\s*document\.Database\s*,\s*transaction\s*,\s*sources\s*,\s*link\s*\)\s*;\s*(?://\s*CE_AUG23_GRID_SYNC)?[ \t]*(?:\r\n)?'
          $text = [regex]::Replace($text,$pattern,'')
          $remaining = ([regex]::Matches($text,'SyncGridLines\s*\(\s*document\.Database\s*,\s*transaction\s*,\s*sources\s*,\s*link\s*\)\s*;')).Count
          if (-not $text.Contains('private static void SyncGridLines(')) { throw 'Grid sync helper was not established.' }
          if ($remaining -ne 0) { throw "Failed to reproduce calls-missing Grid state; remaining=$remaining." }
          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'Packaged Grid helper-present / calls-missing state reproduced.' -ForegroundColor Green

      - name: Run self-healing idempotence finalizer twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repair = Join-Path $env:STAGE 'scripts\Repair-August23-SettingOutCadFeedbackIdempotence-Civil3D2023.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($repair,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            throw (($errors | ForEach-Object { 'line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
          }
          & $repair -RepoRoot $env:STAGE
          & $repair -RepoRoot $env:STAGE

      - name: Verify exactly one sync per Grid method
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August18DynamicGridSettingOutCommands.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $semantic = 'SyncGridLines\s*\(\s*document\.Database\s*,\s*transaction\s*,\s*sources\s*,\s*link\s*\)\s*;'
          $count = ([regex]::Matches($text,$semantic)).Count
          $canonical = ([regex]::Matches($text,'SyncGridLines\(document\.Database, transaction, sources, link\); // CE_AUG23_GRID_SYNC')).Count
          if ($count -ne 2 -or $canonical -ne 2) { throw "Grid sync normalization failed; semantic=$count canonical=$canonical." }
          foreach ($pair in @(
            @('        private static ObjectId CreateGroup(','        private static void RefreshOne(','CreateGroup'),
            @('        private static void RefreshOne(','        private static ObjectId CreateCogo(','RefreshOne'))) {
            $start = $text.IndexOf($pair[0],[StringComparison]::Ordinal)
            $end = $text.IndexOf($pair[1],$start + $pair[0].Length,[StringComparison]::Ordinal)
            if ($start -lt 0 -or $end -lt 0) { throw "Method boundaries missing for $($pair[2])." }
            $method = $text.Substring($start,$end-$start)
            $methodCount = ([regex]::Matches($method,$semantic)).Count
            if ($methodCount -ne 1) { throw "$($pair[2]) expected one Grid sync call; found $methodCount." }
            $syncIndex = $method.IndexOf('SyncGridLines(document.Database, transaction, sources, link);',[StringComparison]::Ordinal)
            $tableIndex = $method.IndexOf('PopulateTable(',[StringComparison]::Ordinal)
            if ($syncIndex -lt 0 -or $tableIndex -lt 0 -or $syncIndex -gt $tableIndex) {
              throw "$($pair[2]) Grid sync call is not immediately upstream of PopulateTable."
            }
          }
          Write-Host 'Grid sync idempotence and placement verified.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
