name: Apply Final Comment Completion

on:
  push:
    branches:
      - agent/finish-all-remaining-comments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out final comment branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-all-remaining-comments
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final source integration
        run: python3 scripts/Apply-FinalCommentCompletion.py

      - name: Validate final comment completion
        run: python3 scripts/Validate-FinalCommentCompletion.py

      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse Civil 3D C# syntax
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/PluginEntry.cs \
                  src/CE.Tools.Civil3D/RoadProductionCommentCommands.cs \
                  src/CE.Tools.Civil3D/ProductionCommentCommands.cs \
                  src/CE.Tools.Civil3D/CurveConversionCommands.cs \
                  scripts/Validate-FinalCommentCompletion.py
          if git diff --cached --quiet; then
            echo "No source integration changes remain."
            exit 0
          fi
          git commit -m "Wire final remaining CE Tools comments"
          git push origin HEAD:agent/finish-all-remaining-comments
