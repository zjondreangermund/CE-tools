name: September 09 Field Engineering Regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/September09FieldEngineeringRuntime.cs'
      - 'src/CE.Tools.Civil3D/September09FieldEngineeringCommandFrontDoor.cs'
      - 'src/CE.Tools.Civil3D/September05FieldGeometryCommandFrontDoor.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'src/CE.Tools.Civil3D/August27DynamicSlopeGridHatchCommands.cs'
      - 'src/CE.Tools.Civil3D/August24FieldCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/SewerBranchAlignmentCommands.cs'
      - 'scripts/Repair-September09-FieldEngineering-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/sep09-field-engineering-regression.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/September09FieldEngineeringRuntime.cs'
      - 'src/CE.Tools.Civil3D/September09FieldEngineeringCommandFrontDoor.cs'
      - 'src/CE.Tools.Civil3D/September05FieldGeometryCommandFrontDoor.cs'
      - 'src/CE.Tools.Civil3D/September04FieldGeometryCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'src/CE.Tools.Civil3D/August27DynamicSlopeGridHatchCommands.cs'
      - 'src/CE.Tools.Civil3D/August24FieldCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/SewerBranchAlignmentCommands.cs'
      - 'scripts/Repair-September09-FieldEngineering-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/sep09-field-engineering-regression.yml'

jobs:
  field-engineering:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate raw AutoCAD command registry
        shell: pwsh
        run: python scripts/validate-CommandRegistry.py

      - name: Reproduce complete Civil 3D 2023 staged finalizer chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-sep09-field-engineering'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src -Destination $stage -Recurse -Force
          Copy-Item scripts -Destination $stage -Recurse -Force
          Copy-Item tests -Destination $stage -Recurse -Force
          Copy-Item global.json -Destination $stage -Force
          Copy-Item Directory.Build.targets -Destination $stage -Force

          & (Join-Path $stage 'scripts\Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August23-PlatformDynamicGrading-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August24-DynamicGridCivilSurfaceCompileFix-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August24-FinalCompileCompatibility-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August24-FloodProductionCulvertMenu-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Invoke-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August26-CadSupplementaryGeometrySafety-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-August27-DynamicSlopeGridHatch-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September04-ConstructionXlineBreakJunctions-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September04-GridRefreshAndBreakStability-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September04-VerifiedJunctionBreak-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September04-SiteGridDynamicNoLoop-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September05-FieldGeometryCompletion-Civil3D2023.ps1') -RepoRoot $stage
          & (Join-Path $stage 'scripts\Repair-September09-FieldEngineering-Civil3D2023.ps1') -RepoRoot $stage
          ('STAGE=' + $stage) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify final staged field-engineering behavior
        shell: pwsh
        run: |
          $runtime = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\September09FieldEngineeringRuntime.cs')
          $grid = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August18DynamicGridSettingOutCommands.cs')
          $completion = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\September04FieldGeometryCompletionCommands.cs')
          $aug27 = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August27DynamicSlopeGridHatchCommands.cs')
          $sewer = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\SewerBranchAlignmentCommands.cs')
          $menu = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August24FieldCompletionCommands.cs')
          $front = Get-Content -Raw (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\September05FieldGeometryCommandFrontDoor.cs')
          $targets = Get-Content -Raw (Join-Path $env:STAGE 'Directory.Build.targets')

          $differenceCalls = ([regex]::Matches($grid,[regex]::Escape('September09FieldEngineeringRuntime.EnsureGridDifferenceColumn(table);'))).Count
          if ($differenceCalls -lt 2) { throw "Grid difference not inside create+refresh transactions; calls=$differenceCalls" }
          foreach ($token in @('"DIFFERENCE"','(designValue - ngValue)','InsertColumns(','September09FieldEngineeringRuntime.GridDifferenceActive();')) {
            if (-not ($runtime.Contains($token) -or $front.Contains($token))) { throw "Grid difference marker missing: $token" }
          }

          foreach ($token in @('CE-ROAD-CENTRELINE','Facing parcel sides only','SnapCentreJunctions(','CE_ROADRESERVECENTRELINES')) {
            if (-not ($runtime.Contains($token) -or $menu.Contains($token))) { throw "Road-reserve centre marker missing: $token" }
          }
          foreach ($token in @('Fillet-ready finite centre lines','bool filletReadyMode','if (!xlineMode && !filletReadyMode)','CE_CONSTRUCTIONFILLET')) {
            if (-not ($completion.Contains($token) -or $menu.Contains($token))) { throw "Construction fillet marker missing: $token" }
          }

          if (-not $aug27.Contains('September09FieldEngineeringRuntime.SurfaceSlopeLabels(document);')) { throw 'Surface slope command is not routed to native Civil labels.' }
          foreach ($token in @('CivilSurfaceSlopeLabel.Create','Surface slope - native Civil 3D label','Slope between two feature lines','Slope along feature lines','CE_SLOPEANNOTATIONS')) {
            if (-not ($runtime.Contains($token) -or $menu.Contains($token))) { throw "Slope marker missing: $token" }
          }

          if (-not $sewer.Contains('September09FieldEngineeringRuntime.CreateSewerAlignmentSafe(')) { throw 'Sewer alignment safe creator route missing.' }
          if (-not $sewer.Contains('EraseExistingEntities = false')) { throw 'Sewer temporary polyline is still erased before safe fallback.' }
          foreach ($token in @('Named-style attempt:','ObjectId fallback:')) {
            if (-not $runtime.Contains($token)) { throw "Sewer fallback diagnostics missing: $token" }
          }

          if (-not $targets.Contains('AfterTargets="CEApplySeptember05FieldGeometryCompletion"')) { throw 'September 09 target is not chained after September 05.' }
          if (-not $targets.Contains('Repair-September09-FieldEngineering-Civil3D2023.ps1')) { throw 'September 09 finalizer target missing.' }
          if ($runtime.Contains('polylineOptions == null')) { throw 'PolylineOptions struct null-check regression remains.' }

      - name: Validate staged AutoCAD command registry
        shell: pwsh
        run: python (Join-Path $env:STAGE 'scripts\validate-CommandRegistry.py')

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
