name: Temporary August 23 Site Grid Refresh Fix

on:
  push:
    branches: [ fix/aug23-video-command-safety ]
    paths:
      - '.github/workflows/_temp-aug23-sitegrid-refresh-fix.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/_temp-aug23-sitegrid-refresh-fix.yml'

permissions:
  contents: write

jobs:
  patch-site-grid:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/aug23-video-command-safety
          fetch-depth: 0

      - name: Apply exact Site Grid display refresh patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs')
          text = path.read_text(encoding='utf-8')

          old_regen = 'document.Editor.Regen();'
          regen_count = text.count(old_regen)
          if regen_count < 3:
              raise SystemExit(f'Expected at least 3 Site Grid Regen calls, found {regen_count}')
          text = text.replace(old_regen, 'August21DisplayRefresh.Flush(document);')

          old_append = '''            ObjectId id = blockTableRecord.AppendEntity(entity);\n            transaction.AddNewlyCreatedDBObject(entity, true);\n            return id;'''
          new_append = '''            ObjectId id = blockTableRecord.AppendEntity(entity);\n            transaction.AddNewlyCreatedDBObject(entity, true);\n            entity.RecordGraphicsModified(true);\n            return id;'''
          if old_append not in text:
              if 'entity.RecordGraphicsModified(true);' not in text:
                  raise SystemExit('Could not find Site Grid AppendEntity helper anchor')
          else:
              text = text.replace(old_append, new_append, 1)

          if text.count('August21DisplayRefresh.Flush(document);') < 3:
              raise SystemExit('Site Grid display flush was not added to all required paths')
          if 'entity.RecordGraphicsModified(true);' not in text:
              raise SystemExit('Site Grid generated entities are not marked graphics-dirty')

          path.write_text(text, encoding='utf-8', newline='')

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-aug23-sitegrid-refresh-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs .github/workflows/_temp-aug23-sitegrid-refresh-fix.yml
          git diff --cached --check
          git commit -m "fix: flush site grid graphics immediately"
          git push origin HEAD:fix/aug23-video-command-safety
