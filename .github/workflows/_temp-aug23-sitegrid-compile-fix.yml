name: Temporary August 23 Site Grid Compile Fix

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/_temp-aug23-sitegrid-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch-site-grid-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/aug23-video-command-safety
          fetch-depth: 0

      - name: Correct deferred Site Grid refresh call
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs')
          text = path.read_text(encoding='utf-8')
          bad = '_August21DisplayRefresh.Flush(document);'
          good = 'August21DisplayRefresh.Flush(_document);'
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed deferred refresh call, found {count}')
          text = text.replace(bad, good, 1)
          if bad in text or good not in text:
              raise SystemExit('Deferred Site Grid refresh correction did not apply cleanly')
          path.write_text(text, encoding='utf-8', newline='')

      - name: Remove temporary workflow and commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-aug23-sitegrid-compile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs .github/workflows/_temp-aug23-sitegrid-compile-fix.yml
          git diff --cached --check
          git commit -m "fix: correct deferred site grid graphics flush"
          git push origin HEAD:fix/aug23-video-command-safety
