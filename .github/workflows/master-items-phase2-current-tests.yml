name: CE Tools Master Items Phase 2 Current

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate-current-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply inherited and Phase 1 normalizers
        shell: pwsh
        run: |
          ./scripts/Invoke-Comments-Normalizer.ps1
          ./scripts/Apply-Comments-Discipline.ps1
          ./scripts/Apply-Comments-Quantities.ps1
          ./scripts/Apply-Comments-Road.ps1
          ./scripts/Invoke-Master-Items-Phase1.ps1

      - name: Apply current Phase 2 normalizers
        shell: pwsh
        run: |
          ./scripts/Apply-Master-Items-Phase2.ps1
          ./scripts/Apply-Master-Items-Phase2-Quantities.ps1
          ./scripts/Apply-Master-Items-Phase2-ProfileViews.ps1
          ./scripts/Apply-Master-Items-Phase2-DetailedSections.ps1

      - name: Normalize Civil 3D compatibility
        shell: pwsh
        run: ./scripts/Apply-Civil3D-Compatibility.ps1

      - name: Validate dynamic parking and grading
        id: validate_parking
        continue-on-error: true
        run: python3 scripts/Validate-MasterItemsPhase2.py 2>&1 | tee phase2-parking-validation.txt

      - name: Validate standard quantity templates
        id: validate_quantities
        continue-on-error: true
        run: python3 scripts/Validate-StandardQuantityTemplates.py 2>&1 | tee phase2-quantity-validation.txt

      - name: Validate profile-view batch cleanup
        id: validate_profiles
        continue-on-error: true
        run: python3 scripts/Validate-ProfileViewBatch.py 2>&1 | tee phase2-profile-validation.txt

      - name: Validate detailed-section annotations
        id: validate_sections
        continue-on-error: true
        run: python3 scripts/Validate-DetailedSectionAnnotations.py 2>&1 | tee phase2-section-validation.txt

      - name: Upload Phase 2 validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-validator-diagnostics
          path: phase2-*-validation.txt
          if-no-files-found: error

      - name: Fail when a Phase 2 validator failed
        if: always()
        run: |
          test "${{ steps.validate_parking.outcome }}" = "success"
          test "${{ steps.validate_quantities.outcome }}" = "success"
          test "${{ steps.validate_profiles.outcome }}" = "success"
          test "${{ steps.validate_sections.outcome }}" = "success"

      - name: Validate Phase 1 and inherited source
        run: |
          python3 scripts/Validate-MasterItemsPhase1.py
          python3 scripts/Validate-RoadSectionSchedule.py
          python3 scripts/Validate-NetworkAssetSchedule.py
          python3 scripts/Validate-Comments-2026-07-25.py
          python3 scripts/Validate-DisciplineComments.py
          python3 scripts/Validate-SewerExcavation.py
          python3 scripts/Validate-RoadProduction.py
          python3 scripts/Validate-BillOfQuantities.py
          python3 scripts/Validate-WorkflowRepairs.py
          python3 scripts/Validate-DynamicTypicalDetails.py

      - name: Validate unique command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run host-independent geometry tests
        run: dotnet run --project tests/CE.Tools.Core.Tests/CE.Tools.Core.Tests.csproj -c Release
