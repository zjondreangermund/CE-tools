name: Apply Latest Runtime Design Fixes

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/latest-runtime-design-comments
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply latest runtime/design fixes
        run: python3 scripts/Apply-LatestRuntimeDesignFixes.py

      - name: Validate latest runtime/design comments
        run: python3 scripts/Validate-LatestRuntimeDesignComments.py

      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Validate preserved CE Tools features
        run: python3 scripts/Validate-PreservedFeatures.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse all Civil 3D C# source
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs \
                  src/CE.Tools.Civil3D/VertexSettingOutCommands.cs \
                  src/CE.Tools.Civil3D/PreBuildRuntimeCompletionCommands.cs \
                  src/CE.Tools.Civil3D/CogoPointProjectStyleCommands.cs \
                  src/CE.Tools.Civil3D/GridReportPresenter.cs \
                  src/CE.Tools.Civil3D/SewerProductionCommands.cs \
                  src/CE.Tools.Civil3D/CurveConversionCommands.cs \
                  src/CE.Tools.Civil3D/PluginEntry.cs
          if git diff --cached --quiet; then
            echo "No source changes remain."
            exit 0
          fi
          git commit -m "Fix latest runtime annotation, table and geometry comments"
          git push origin HEAD:agent/latest-runtime-design-comments
