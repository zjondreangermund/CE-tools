name: August 21 CAD Production Field Finalizer

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August21CadProductionCommands.cs'
      - 'src/CE.Tools.Civil3D/August21SafePolylineBreakEngine.cs'
      - 'scripts/Repair-August21-CadProductionFieldFinalizer-Civil3D2023.ps1'
      - 'scripts/Repair-August21-PluginManagerCompatibility-Civil3D2023.ps1'
      - '.github/workflows/aug21-cad-production-field-finalizer-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August21CadProductionCommands.cs'
      - 'src/CE.Tools.Civil3D/August21SafePolylineBreakEngine.cs'
      - 'scripts/Repair-August21-CadProductionFieldFinalizer-Civil3D2023.ps1'
      - 'scripts/Repair-August21-PluginManagerCompatibility-Civil3D2023.ps1'
      - '.github/workflows/aug21-cad-production-field-finalizer-regression.yml'

jobs:
  staged-field-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staged repository copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-tools-aug21-cad-field'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination $stage -Force
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse new repair scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'Repair-August21-CadProductionFieldFinalizer-Civil3D2023.ps1',
            'Repair-August21-PluginManagerCompatibility-Civil3D2023.ps1')) {
            $path = Join-Path $env:STAGE ('scripts\' + $name)
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw (($errors | ForEach-Object { $name + ' line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
            }
          }

      - name: Reproduce late staged dimension state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:STAGE 'scripts\Repair-August20-MultiDimensionCircleUnitsAndProperties-Civil3D2023.ps1') -RepoRoot $env:STAGE

      - name: Run compatibility bridge and final page pass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:STAGE 'scripts\Repair-August21-PluginManagerCompatibility-Civil3D2023.ps1') -RepoRoot $env:STAGE
          $page = Join-Path $env:STAGE 'scripts\Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1'
          $pageText = [System.IO.File]::ReadAllText($page)
          if (-not $pageText.Contains('Repair-August21-CadProductionFieldFinalizer-Civil3D2023.ps1')) {
            throw 'Compatibility bridge did not chain CAD/field finalizer after page/dimension/trim repair.'
          }
          & $page -RepoRoot $env:STAGE

      - name: Verify exact field fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $floating = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\FloatingToolsWindow.cs') -Raw
          $cad = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August21CadProductionCommands.cs') -Raw
          $dim = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs') -Raw
          $grid = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August12SurveySiteGridCommands.cs') -Raw
          $break = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\PolylineNetworkPreparationCommands.cs') -Raw
          $safe = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August21SafePolylineBreakEngine.cs') -Raw

          foreach ($marker in @(
            '"cadproduction", "CE-CAD Production"',
            'Step("Open CE-CAD Production page", "CE_CADPRODUCTION")')) {
            if (-not $floating.Contains($marker)) { throw "CE-CAD workflow tab marker missing: $marker" }
          }
          foreach ($marker in @(
            '"CE_CADPRODUCTION"',
            '"01 GENERAL PRODUCTION"',
            '"02 ANNOTATION PRODUCTION"',
            '"03 BACKGROUND PRODUCTION"',
            '"04 CLEANUP PRODUCTION"',
            '"05 XREF PRODUCTION"',
            '"06 HATCH PRODUCTION"')) {
            if (-not $cad.Contains($marker)) { throw "CE-CAD production page marker missing: $marker" }
          }
          foreach ($marker in @(
            'settings.Text("ValueUnits")',
            'double chainMeasurementFactor = chainOutputMillimetres ? 1000.0 : 1.0;',
            'dimension.Dimlfac = chainMeasurementFactor;',
            'if (chainOutputMillimetres) dimension.Dimdec = 0;')) {
            if (-not $dim.Contains($marker)) { throw "Chain dimension millimetre marker missing: $marker" }
          }
          if (([regex]::Matches($grid,[regex]::Escape('August21DisplayRefresh.Flush(document);'))).Count -lt 3) {
            throw 'Site Grid does not flush display after create/manual refresh/linked refresh.'
          }
          if (-not $grid.Contains('entity.RecordGraphicsModified(true);')) {
            throw 'Site Grid generated children are not graphics-dirty.'
          }
          if (-not $break.Contains('August21SafePolylineBreakEngine.Run(document);')) {
            throw 'CE_PLBREAKJUNCTIONS is not delegated to safe per-source engine.'
          }
          foreach ($marker in @(
            'VerifyReplacement(',
            'Cleanup(database, newIds);',
            'source.Erase();',
            'LengthMatches(originalLength, total)')) {
            if (-not $safe.Contains($marker)) { throw "Safe break verification marker missing: $marker" }
          }
          $verifyIndex = $safe.IndexOf('VerifyReplacement(',[StringComparison]::Ordinal)
          $eraseIndex = $safe.IndexOf('source.Erase();',[StringComparison]::Ordinal)
          if ($verifyIndex -lt 0 -or $eraseIndex -le $verifyIndex) {
            throw 'Safe break source erase is not ordered after replacement verification.'
          }
          Write-Host 'CAD Production tab, millimetre chain, Site Grid display and safe-break staged regression passed.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
