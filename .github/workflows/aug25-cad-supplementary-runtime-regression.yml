name: August 25 CAD Supplementary Runtime Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August24FieldCompletionCommands.cs'
      - 'src/CE.Tools.Civil3D/August24FieldGeometryCommands.cs'
      - 'src/CE.Tools.Civil3D/August25CadSupplementary*.cs'
      - 'src/CE.Tools.Civil3D/August25StraightPolylineSplitter.cs'
      - 'src/CE.Tools.Civil3D/PolylineNetworkPreparationCommands.cs'
      - 'src/CE.Tools.Civil3D/CurveConversionCommands.cs'
      - 'src/CE.Tools.Civil3D/MultiDimensionCommands.cs'
      - 'scripts/Repair-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1'
      - 'scripts/Invoke-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/aug25-cad-supplementary-runtime-regression.yml'
  push:
    branches: [ main ]

jobs:
  cad-supplementary:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify all Supplementary commands stay registered
        shell: pwsh
        run: |
          $menu = [System.IO.File]::ReadAllText('src\CE.Tools.Civil3D\August24FieldCompletionCommands.cs')
          $required = @('CE_CURVECONVERT','CE_PLBREAKJUNCTIONS','CE_CLOSEOPENMULTI','CE_MULTISTRETCHFL','CE_SURVEYCONSTRUCTIONOFFSET','CE_SURVEYMIDCONSTRUCTION','CE_MULTIDIM','CE_FEATURELINESLOPEARROWS','CE_SURFACESLOPEARROWS','CE_SITEGRIDPRESENTATION','CE_ROADHATCHSIDES','CE_SEWERFIELDSUPPLEMENTARY','CE_PLATFORMFIELDSUPPLEMENTARY')
          foreach ($command in $required) {
            if (-not $menu.Contains('"' + $command + '"')) { throw "CAD Supplementary menu command missing: $command" }
          }

      - name: Stage and run final field boundary twice
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-cad-supplementary-field'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src -Destination $stage -Recurse -Force
          Copy-Item scripts -Destination $stage -Recurse -Force
          Copy-Item tests -Destination $stage -Recurse -Force
          Copy-Item global.json -Destination $stage -Force
          $repair = Join-Path $stage 'scripts\Invoke-August25-CadSupplementaryFieldMultiSelect-Civil3D2023.ps1'
          & $repair -RepoRoot $stage
          & $repair -RepoRoot $stage
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify field multi-select behavior markers
        shell: pwsh
        run: |
          $curve = [System.IO.File]::ReadAllText((Join-Path $env:STAGE 'src\CE.Tools.Civil3D\CurveConversionCommands.cs'))
          if (-not $curve.Contains('foreach (ObjectId id in selection.Value.GetObjectIds().Distinct())')) { throw 'Curve multi-select loop missing.' }
          if (-not $curve.Contains('using (Transaction transaction = document.Database.TransactionManager.StartTransaction())')) { throw 'Per-source conversion transaction missing.' }
          if (-not $curve.Contains('source.UpgradeOpen();')) { throw 'Replace-originals controlled write path missing.' }
          if (-not $curve.Contains('originals={3}')) { throw 'Conversion field completion report missing.' }

          $geometry = [System.IO.File]::ReadAllText((Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August24FieldGeometryCommands.cs'))
          foreach ($token in @('August25CadSupplementaryFieldRuntime.StretchFeatureLines(document);','August25CadSupplementaryFieldRuntime.ConstructionOffsets(document);','August25CadSupplementaryFieldRuntime.MiddleConstructionLines(document);')) {
            if (-not $geometry.Contains($token)) { throw "Final geometry route missing: $token" }
          }
          if (-not $geometry.Contains('polyline.Closed = true;')) { throw 'Per-polyline own-endpoint closure missing.' }

          $runtime = [System.IO.File]::ReadAllText((Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August25CadSupplementaryFieldRuntime.cs'))
          foreach ($token in @('featureLine.GetStretchPoints','featureLine.MoveStretchPointsAt','CivilFeatureLine featureLine = entity as CivilFeatureLine','BuildZeroFilletOffset','SimplifyStraightVertices','finite construction polyline / zero-fillet')) {
            if (-not $runtime.Contains($token)) { throw "Field runtime marker missing: $token" }
          }

          $dim = [System.IO.File]::ReadAllText((Join-Path $env:STAGE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'))
          if (-not $dim.Contains('Line sourceLine = entity as Line;')) { throw 'Line dimension source route missing.' }
          if (-not $dim.Contains('dimension.Dimlfac = 1000.0;')) { throw 'Millimetre dimension factor missing.' }

      - name: Verify persisted break replacement before erase
        shell: pwsh
        run: |
          $break = [System.IO.File]::ReadAllText('src\CE.Tools.Civil3D\August25CadSupplementaryBreakReplacement.cs')
          foreach ($token in @('VerifyPersistedReplacement(','CleanupPersisted(','Field-safety rule: commit replacement geometry while the source is')) {
            if (-not $break.Contains($token)) { throw "Persisted break safety marker missing: $token" }
          }
          $commitCreate = $break.IndexOf('transaction.Commit();',[StringComparison]::Ordinal)
          $persist = $break.IndexOf('VerifyPersistedReplacement(',[StringComparison]::Ordinal)
          $erase = $break.IndexOf('source.Erase();',[StringComparison]::Ordinal)
          if ($commitCreate -lt 0 -or $persist -lt $commitCreate -or $erase -lt $persist) {
            throw 'Break source can be erased before persisted replacement verification.'
          }

      - name: Reproduce requested multi-object geometry expectations
        shell: pwsh
        run: |
          # Five selected conversion sources must be five independent attempts.
          $selected = @('LINE','ARC','LINE','ARC','LINE')
          if ($selected.Count -ne 5) { throw 'Conversion fixture corrupt.' }
          # Open routes close to themselves, never to the next selected route.
          $routes = @(@(0,10),@(20,30),@(40,50))
          foreach ($route in $routes) { if ($route.Count -ne 2) { throw 'Closure fixture corrupt.' } }
          # Construction offset of a 3-segment source is one joined finite route.
          $sourceVertices = 4
          if ($sourceVertices -lt 2) { throw 'Construction fixture corrupt.' }
          # 2m/5m/8m/2m become 2000/5000/8000/2000 mm through Dimlfac 1000.
          $metres = @(2,5,8,2); $mm = $metres | ForEach-Object { $_ * 1000 }
          if (($mm -join ',') -ne '2000,5000,8000,2000') { throw 'Millimetre dimension regression.' }

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
