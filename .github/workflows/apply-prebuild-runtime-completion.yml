name: Apply Pre-Build Runtime Completion

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-prebuild-runtime-comments
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align patch with current sequence source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/Apply-PreBuildRuntimeCompletion.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "'''            int pipes = 0;\n            int structures = 0;\n            for (int branchIndex = 0; branchIndex < branches.Count; branchIndex++)'''",
              "'''            var namedStructures = new HashSet<ObjectId>();\n            for (int branchIndex = 0; branchIndex < branches.Count; branchIndex++)'''",
          )
          text = text.replace(
              "'''            int pipes = 0;\n            int structures = 0;\n            // Civil 3D enforces unique part names immediately.",
              "'''            var namedStructures = new HashSet<ObjectId>();\n            // Civil 3D enforces unique part names immediately.",
          )
          text = text.replace(
              "'''        internal static void Queue()\n        {\n            _pending = true;\n            _lastChangeUtc = DateTime.UtcNow;\n        }'''",
              "'''        public static void Queue()\n        {\n            _pending = true;\n            _lastChangeUtc = DateTime.UtcNow;\n        }'''",
          )
          text = text.replace(
              "'''        internal static void Queue()\n        {\n            _pending = true;\n            _lastChangeUtc = DateTime.UtcNow;\n            UniversalDynamicRefreshManager.Queue();\n        }'''",
              "'''        public static void Queue()\n        {\n            _pending = true;\n            _lastChangeUtc = DateTime.UtcNow;\n            UniversalDynamicRefreshManager.Queue();\n        }'''",
          )
          text = text.replace(
              "'''            if (!_pending || _busy || document == null) return;\n            if ((DateTime.UtcNow - _lastChangeUtc).TotalMilliseconds < 1200.0) return;'''",
              "'''            if (!Enabled || !_pending || _busy || document == null) return;\n            if ((DateTime.UtcNow - _lastChangeUtc).TotalMilliseconds < 1100.0)\n                return;'''",
          )
          text = text.replace(
              "'''            if (!_pending || _busy || document == null) return;\n            if (UniversalDynamicRefreshManager.Enabled)",
              "'''            if (!Enabled || !_pending || _busy || document == null) return;\n            if (UniversalDynamicRefreshManager.Enabled)",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply final runtime integration
        run: |
          python3 scripts/Apply-PreBuildRuntimeCompletion.py
          sed -i 's/temporary++\.ToString/(temporary++).ToString/g' src/CE.Tools.Civil3D/SewerNetworkDynamicSequenceManager.cs

      - name: Validate complete runtime comment batch
        run: python3 scripts/Validate-PreBuildRuntimeCompletion.py

      - name: Validate unique command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse all Civil 3D C# source
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/CurveConversionCommands.cs \
                  src/CE.Tools.Civil3D/VertexSettingOutCommands.cs \
                  src/CE.Tools.Civil3D/ProjectStylePresetManager.cs \
                  src/CE.Tools.Civil3D/CogoPointProjectStyleCommands.cs \
                  src/CE.Tools.Civil3D/CommentPresentationCommands.cs \
                  src/CE.Tools.Civil3D/SewerLabelStyleSyncCommands.cs \
                  src/CE.Tools.Civil3D/SewerNetworkDynamicSequenceManager.cs \
                  src/CE.Tools.Civil3D/UniversalDynamicRefreshCommands.cs \
                  src/CE.Tools.Civil3D/SewerProductionCommands.cs \
                  src/CE.Tools.Civil3D/PluginEntry.cs
          if git diff --cached --quiet; then
            echo "No integration changes remain."
            exit 0
          fi
          git commit -m "Finish all runtime comments before Civil 3D build"
          git push origin HEAD:agent/finish-prebuild-runtime-comments
