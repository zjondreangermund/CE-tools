name: Temporary August 23 Boundary Selection Compatibility Fix

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/_temp-aug23-boundary-selection-compat.yml'

permissions:
  contents: write

jobs:
  patch-boundary-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/aug23-video-command-safety
          fetch-depth: 0

      - name: Separate boundary and target selections and modernize finalizer marker
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/CE.Tools.Civil3D/MultiBoundaryEditCommands.cs')
          text = source_path.read_text(encoding='utf-8')

          method_marker = '        private static List<ObjectId> SelectBoundaries(Document document)'
          start = text.find(method_marker)
          if start < 0:
              raise SystemExit('SelectBoundaries method not found')
          open_brace = text.find('{', start)
          status_anchor = text.find('            if (selection.Status != PromptStatus.OK || selection.Value == null)', open_brace)
          if open_brace < 0 or status_anchor < 0:
              raise SystemExit('SelectBoundaries replacement anchors not found')
          explicit = '''\n            // Always select boundaries explicitly. PICKFIRST belongs to the user's\n            // target workflow and must never silently become a protected boundary.\n            document.Editor.SetImpliedSelection(new ObjectId[0]);\n            var filter = new SelectionFilter(new[]\n            {\n                new TypedValue((int)DxfCode.Start, "LWPOLYLINE")\n            });\n            PromptSelectionResult selection = document.Editor.GetSelection(\n                new PromptSelectionOptions\n                {\n                    MessageForAdding = "\\nSelect CLOSED polyline trimming boundary objects: ",\n                    AllowDuplicates = false,\n                    RejectObjectsFromNonCurrentSpace = true\n                },\n                filter);\n'''
          text = text[:open_brace + 1] + explicit + text[status_anchor:]

          resolve_marker = '        private static List<ObjectId> ResolveTargets('
          resolve_start = text.find(resolve_marker)
          if resolve_start < 0:
              raise SystemExit('ResolveTargets method not found')
          selected_start = text.find('if (string.Equals(scope, "Selected", StringComparison.OrdinalIgnoreCase))', resolve_start)
          prompt_anchor = text.find('                PromptSelectionResult selection = document.Editor.GetSelection(', selected_start)
          if selected_start < 0 or prompt_anchor < 0:
              raise SystemExit('ResolveTargets selected-scope anchors not found')
          clear_line = '                document.Editor.SetImpliedSelection(new ObjectId[0]);\n'
          nearby = text[selected_start:prompt_anchor]
          if 'SetImpliedSelection' not in nearby:
              text = text[:prompt_anchor] + clear_line + text[prompt_anchor:]

          if 'SelectImplied()' in text[text.find(method_marker):text.find('        private static List<Polyline> OpenBoundaries', start)]:
              raise SystemExit('SelectBoundaries still consumes PICKFIRST')
          source_path.write_text(text, encoding='utf-8', newline='')

          script_path = Path('scripts/Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1')
          script = script_path.read_text(encoding='utf-8')
          old = "$trim = ReplaceMethodBody $trim '        private static List<ObjectId> ResolveTargets(Document document, string scope, IList<ObjectId> boundaryIds, bool extend)' $resolveTargetsBody 'Multi Trim target validation'"
          new = "$trim = ReplaceMethodBody $trim '        private static List<ObjectId> ResolveTargets(' $resolveTargetsBody 'Multi Trim target validation'"
          if old in script:
              script = script.replace(old, new, 1)
          elif new not in script:
              raise SystemExit('August 21 ResolveTargets finalizer marker not found')
          script_path.write_text(script, encoding='utf-8', newline='')

      - name: Remove temporary workflow and commit correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-aug23-boundary-selection-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/MultiBoundaryEditCommands.cs scripts/Repair-August21-PlatformPageOrderMultiDimensionTrim-Civil3D2023.ps1 .github/workflows/_temp-aug23-boundary-selection-compat.yml
          git diff --cached --check
          git commit -m "fix: separate boundary and target selections"
          git push origin HEAD:fix/aug23-video-command-safety
