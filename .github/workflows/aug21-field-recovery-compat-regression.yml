name: August 21 Field Recovery Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/Repair-August21-SiteGridAppendCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-SewerSequenceDeferredLabelsCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-RoadCentrelineMenuCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-SewerLayoutMenuCompatibility-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/SewerSequenceCommands.cs'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/August13RoadProductionCentres.cs'
      - 'src/CE.Tools.Civil3D/August14StructuredDisciplineProductionCentres.cs'
      - '.github/workflows/aug21-field-recovery-compat-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'scripts/Repair-August21-SiteGridAppendCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-SewerSequenceDeferredLabelsCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-RoadCentrelineMenuCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August21-SewerLayoutMenuCompatibility-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/SewerSequenceCommands.cs'
      - 'src/CE.Tools.Civil3D/August12SurveySiteGridCommands.cs'
      - 'src/CE.Tools.Civil3D/August13RoadProductionCentres.cs'
      - 'src/CE.Tools.Civil3D/August14StructuredDisciplineProductionCentres.cs'
      - '.github/workflows/aug21-field-recovery-compat-regression.yml'

jobs:
  reproduce-field-recovery-state:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate August 20 sequence-only staged source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\SewerSequenceCommands.cs'
          $text = [System.IO.File]::ReadAllText($path) -replace "`r?`n", "`r`n"

          $wholePattern = '\s*SewerNetworkLabelCommands\.EnsureLabels\(\s*document,\s*plans\.Select\(plan\s*=>\s*plan\.NetworkId\)\s*\);'
          $wholeMatches = [regex]::Matches($text,$wholePattern,[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($wholeMatches.Count -ne 1) { throw "Regression setup whole-network EnsureLabels matches=$($wholeMatches.Count)." }
          $wholeSafety = @'
                editor.WriteMessage(
                    "\nCE_SEWSEQ safety: sequencing/renaming is complete. Run sewer labels, alignments and linked refresh as separate commands after reviewing the network.");
          '@ -replace "`r?`n", "`r`n"
          $text = [regex]::Replace($text,$wholePattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $wholeSafety.TrimEnd("`r","`n") },[System.Text.RegularExpressions.RegexOptions]::Singleline)

          $selectedPattern = 'if\s*\(!labelledNetworkId\.IsNull\)\s*\{\s*SewerNetworkLabelCommands\.EnsureLabels\(\s*document,\s*new\[\]\s*\{\s*labelledNetworkId\s*\}\s*\);\s*\}'
          $selectedMatches = [regex]::Matches($text,$selectedPattern,[System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($selectedMatches.Count -ne 1) { throw "Regression setup selected-path EnsureLabels matches=$($selectedMatches.Count)." }
          $selectedSafety = @'
                if (!labelledNetworkId.IsNull)
                {
                    editor.WriteMessage(
                        "\nCE_SEWSEQ safety: selected-path sequencing/renaming is complete. Run sewer labels, alignments and linked refresh separately.");
                }
          '@ -replace "`r?`n", "`r`n"
          $text = [regex]::Replace($text,$selectedPattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $selectedSafety.TrimEnd("`r","`n") },[System.Text.RegularExpressions.RegexOptions]::Singleline)
          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))

          $staged = [System.IO.File]::ReadAllText($path)
          if ($staged.Contains('SewerNetworkLabelCommands.EnsureLabels(')) { throw 'Regression setup left synchronous EnsureLabels calls.' }
          if (-not $staged.Contains('CE_SEWSEQ safety: sequencing/renaming is complete.')) { throw 'Regression setup missing whole-network safety message.' }
          if (-not $staged.Contains('CE_SEWSEQ safety: selected-path sequencing/renaming is complete.')) { throw 'Regression setup missing selected-path safety message.' }
          Write-Host 'Exact August 20 sequence-only state reproduced.' -ForegroundColor Green

      - name: Verify compact legacy Road and Sewer routes are present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roadPath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August13RoadProductionCentres.cs'
          $road = [System.IO.File]::ReadAllText($roadPath)
          $legacyRoad = 'A\(\s*"CE-Road Reserve Centrelines"\s*,\s*"CE_ROADRESERVECENTERLINES"'
          if (-not [regex]::IsMatch($road,$legacyRoad)) {
            throw 'Regression setup no longer contains the compact/legacy Road Reserve centreline route.'
          }

          $sewerPath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August14StructuredDisciplineProductionCentres.cs'
          $sewer = [System.IO.File]::ReadAllText($sewerPath)
          $legacySewer = 'A\(\s*"CE-Midblock / Road-Reserve Sewer Route"\s*,\s*"CE_MIDBLOCKSEWERPRODUCTION"'
          if (-not [regex]::IsMatch($sewer,$legacySewer)) {
            throw 'Regression setup no longer contains the combined legacy Sewer Layout route.'
          }
          Write-Host 'Exact Road and Sewer Layout legacy route states reproduced.' -ForegroundColor Green

      - name: Run pre-field-recovery compatibility bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-August21-SiteGridAppendCompatibility-Civil3D2023.ps1') -RepoRoot $env:GITHUB_WORKSPACE

      - name: Verify exact failed guards are now satisfied
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sequencePath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\SewerSequenceCommands.cs'
          $fieldPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\Repair-August20-FieldRecoveryPass-Civil3D2023.ps1'
          $sitePath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August12SurveySiteGridCommands.cs'
          $roadPath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August13RoadProductionCentres.cs'
          $sewerPath = Join-Path $env:GITHUB_WORKSPACE 'src\CE.Tools.Civil3D\August14StructuredDisciplineProductionCentres.cs'
          $sequence = [System.IO.File]::ReadAllText($sequencePath)
          $field = [System.IO.File]::ReadAllText($fieldPath)
          $site = [System.IO.File]::ReadAllText($sitePath)
          $road = [System.IO.File]::ReadAllText($roadPath)
          $sewer = [System.IO.File]::ReadAllText($sewerPath)

          $queue = 'document.SendStringToExecute("CE_SEWLABELS ", true, false, false);'
          $queueCount = ([regex]::Matches($sequence,[regex]::Escape($queue))).Count
          if ($queueCount -lt 2) { throw "Expected two deferred CE_SEWLABELS queue points; found $queueCount." }
          if ($sequence.Contains('SewerNetworkLabelCommands.EnsureLabels(')) { throw 'Synchronous EnsureLabels survived compatibility.' }
          if (-not $sequence.Contains('CE_SEWSEQ complete. Sequencing/renaming is committed;')) { throw 'Whole-network deferred-label state missing.' }
          if (-not $sequence.Contains('CE_SEWSEQ selected path complete.')) { throw 'Selected-path deferred-label state missing.' }
          if (-not $field.Contains('document.SendStringToExecute("CE_SEWLABELS ", true, false, false);')) { throw 'Historical field-recovery sewer guard contract changed unexpectedly.' }
          if (-not $site.Contains('private static ObjectId Append(') -or -not $site.Contains('entity.RecordGraphicsModified(true);')) { throw 'Site Grid compatibility contract was not preserved.' }

          $safeRoad = 'A("CE-Road Reserve Centrelines", "CE_ROADCENTERLINEPOLY"'
          if (-not $road.Contains($safeRoad)) { throw 'Road Production was not normalized to the exact safe CE_ROADCENTERLINEPOLY guard string.' }
          if ($road.Contains('"CE_ROADRESERVECENTERLINES"')) { throw 'Legacy Road Reserve centreline menu command survived compatibility.' }
          if (-not $field.Contains($safeRoad)) { throw 'Historical field-recovery Road Production guard contract changed unexpectedly.' }

          foreach ($required in @('"CE_SEWERLAYOUTMIDBLOCK"','"CE_SEWERLAYOUTROADRESERVE"')) {
            if (-not $sewer.Contains($required)) { throw "Sewer Layout compatibility missing required geometry-only route: $required" }
            if (-not $field.Contains($required)) { throw "Historical field-recovery Sewer Layout guard contract changed unexpectedly: $required" }
          }
          if ([regex]::IsMatch($sewer,'A\(\s*"CE-Midblock / Road-Reserve Sewer Route"')) {
            throw 'Combined legacy Sewer Layout route survived compatibility.'
          }
          Write-Host 'Site Grid, Sewer Sequence, Road Production and Sewer Layout field-recovery compatibility guards are satisfied.' -ForegroundColor Green
