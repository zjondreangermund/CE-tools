name: Apply sewer project production popup fix

on:
  push:
    branches:
      - agent/fix-sewer-alignment-project-production-popups
  pull_request:
    branches:
      - agent/fix-sewer-alignment-project-production-popups

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-sewer-alignment-project-production-popups
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair integration matcher
        run: python3 scripts/Repair-SewerProjectProductionPatch.py

      - name: Narrow drawing register method patch
        run: python3 scripts/Repair-DrawingRegisterPatch.py

      - name: Apply source repairs
        run: python3 scripts/Apply-SewerProjectProductionPopupFix.py

      - name: Show drawing-book integration markers
        shell: bash
        run: |
          grep -n -E "ProductionDrawingRegister|ProductionTitleBlock|drawingRegister|CreateOrRefreshBookLayout" src/CE.Tools.Civil3D/ProductionReportCommands.cs | head -120 || true
          echo "--- GENERATED DRAWING BOOK SECTION ---"
          sed -n '520,760p' src/CE.Tools.Civil3D/ProductionReportCommands.cs

      - name: Validate sewer, project and production popups
        run: python3 scripts/Validate-SewerProjectProductionPopups.py

      - name: Validate discipline production dialogs
        run: python3 scripts/Validate-DisciplineProductionDialogs.py

      - name: Validate Civil style catalogue and sewer labels
        run: python3 scripts/Validate-CivilStyleCatalogueAndSewerLabels.py

      - name: Validate workflow command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D scripts/Validate-SewerProjectProductionPopups.py
          if git diff --cached --quiet; then
            echo "No integration changes remain."
            exit 0
          fi
          git commit -m "Fix sewer alignment styles and production metadata popups"
          git push origin HEAD:agent/fix-sewer-alignment-project-production-popups
