name: Apply road and vertex integration

on:
  push:
    branches:
      - agent/fix-road-assembly-vertex-settingout
    paths:
      - scripts/Apply-AgentRoadVertexPatch.py
      - .github/workflows/agent-road-vertex-patch.yml
  pull_request:
    branches:
      - main
      - agent/fix-road-assembly-vertex-settingout
    paths:
      - scripts/Apply-AgentRoadVertexPatch.py
      - src/CE.Tools.Civil3D/**
      - .github/workflows/agent-road-vertex-patch.yml
      - .github/agent-road-vertex-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-road-assembly-vertex-settingout
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Correct patch-script guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/Apply-AgentRoadVertexPatch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'if "CE_FLRELUPDATEMULTI" not in feature.split(command_marker, 1)[0]:',
              'if "public void UpdateMultipleCommand()" not in feature:',
          )
          text = text.replace(
              '"VertexSettingOutCommands.RefreshAll",',
              '"internal static int RefreshAll(Document document)",',
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply targeted source integration
        run: python scripts/Apply-AgentRoadVertexPatch.py

      - name: Validate patch idempotency and source formatting
        shell: bash
        run: |
          git diff --check
          before="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          python scripts/Apply-AgentRoadVertexPatch.py
          after="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          python -m compileall -q scripts
          if test -f scripts/Validate-RoadAssemblyProduction.py; then
            python scripts/Validate-RoadAssemblyProduction.py
          fi
          if test -f scripts/Validate-FeatureLineSteppedWorkflows.py; then
            python scripts/Validate-FeatureLineSteppedWorkflows.py
          fi

      - name: Parse all C# source with Roslyn
        shell: bash
        run: |
          work="${RUNNER_TEMP}/ce-tools-syntax"
          dotnet new console --framework net8.0 --output "$work" --force >/dev/null
          dotnet add "$work/ce-tools-syntax.csproj" package Microsoft.CodeAnalysis.CSharp >/dev/null
          cat > "$work/Program.cs" <<'CS'
          using Microsoft.CodeAnalysis;
          using Microsoft.CodeAnalysis.CSharp;

          var root = Path.Combine(Environment.CurrentDirectory, "src");
          var failures = new List<string>();
          foreach (var path in Directory.EnumerateFiles(root, "*.cs", SearchOption.AllDirectories))
          {
              var source = File.ReadAllText(path);
              var tree = CSharpSyntaxTree.ParseText(
                  source,
                  new CSharpParseOptions(LanguageVersion.Latest),
                  path);
              foreach (var diagnostic in tree.GetDiagnostics().Where(
                  item => item.Severity == DiagnosticSeverity.Error))
              {
                  failures.Add(diagnostic.ToString());
              }
          }
          if (failures.Count > 0)
          {
              Console.Error.WriteLine(string.Join(Environment.NewLine, failures));
              return 1;
          }
          Console.WriteLine("Roslyn syntax validation passed for all C# source files.");
          return 0;
          CS
          dotnet run --project "$work/ce-tools-syntax.csproj" --configuration Release

      - name: Commit integrated source files
        if: github.event_name == 'push' || github.base_ref == 'agent/fix-road-assembly-vertex-settingout'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/Apply-AgentRoadVertexPatch.py \
            src/CE.Tools.Civil3D/RoadProductionCommentCommands.cs \
            src/CE.Tools.Civil3D/CeAssemblyCommands.cs \
            src/CE.Tools.Civil3D/FeatureLineRelativeCommands.cs \
            src/CE.Tools.Civil3D/CommentPresentationCommands.cs \
            src/CE.Tools.Civil3D/PluginEntry.cs
          git commit -m "feat: integrate road assembly and vertex setting-out"
          git push origin HEAD:agent/fix-road-assembly-vertex-settingout
