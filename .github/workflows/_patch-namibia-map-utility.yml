name: CE Tools Namibia Map Utility Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/namibia-map-utility-planner'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 scripts/_Patch-NamibiaMapUtilityPlanner.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/CE.Tools.Civil3D/UtilityPlanningCommands.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if (!double.IsFinite(minX) || !double.IsFinite(minY) || !double.IsFinite(maxX) || !double.IsFinite(maxY)) return null;',
                        'if (double.IsNaN(minX) || double.IsInfinity(minX) || double.IsNaN(minY) || double.IsInfinity(minY) || double.IsNaN(maxX) || double.IsInfinity(maxX) || double.IsNaN(maxY) || double.IsInfinity(maxY)) return null;')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate Namibia map and utility planner
        run: python3 scripts/Validate-NamibiaMapUtilityPlanner.py

      - name: Validate latest runtime/design comments
        run: python3 scripts/Validate-LatestRuntimeDesignComments.py

      - name: Validate unique command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Parse Civil 3D C# syntax
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- src/CE.Tools.Civil3D/ProjectCoordinationCommands.cs src/CE.Tools.Civil3D/UtilityPlanningCommands.cs; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'ce-tools-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/CE.Tools.Civil3D/ProjectCoordinationCommands.cs src/CE.Tools.Civil3D/UtilityPlanningCommands.cs
          git commit -m 'fix: signed WGS84 map input and Namibia utility planning'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
