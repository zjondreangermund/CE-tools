name: Inspect Latest Runtime Comments

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate affected commands and implementations
        shell: bash
        run: |
          echo '=== ROAD SETTINGS / BAND / ASSEMBLY ==='
          grep -RniE -C 4 'SewerProductionSettings|CE_SEWERSETTINGS|CE_SWSETTINGS|CE_WATERSETTINGS|Profile View Band Set Style|Road-Single-Band|Road-Sinle-Band|CE_ASSEMBLYCREATE|GetAssemblyIds' src/CE.Tools.Civil3D || true
          echo '=== SURVEY / COORDINATE SYSTEM / MAP ==='
          grep -RniE -C 4 'Lat.*Long|Latitude|Longitude|CoordinateSystem|LO17|LO15|Google Earth|Google Maps|EPSG|UTM|Map' src/CE.Tools.Civil3D || true
          echo '=== XREF / MASTER DRAWING ==='
          grep -RniE -C 4 'Xref|AttachXref|OverlayXref|BindXrefs|master drawing|discipline.*drawing' src/CE.Tools.Civil3D || true
          echo '=== PAGE SETUP / LAYOUT ==='
          grep -RniE -C 4 'PageSetup|PlotSettings|LayoutManager|paper space|paper-space|PlotConfiguration' src/CE.Tools.Civil3D || true
          echo '=== FEATURE/CORRIDOR DYNAMIC LABELS ==='
          grep -RniE -C 4 'CE_FLLABELX|CE_CORLABELX|Feature Line Report|Corridor.*Table|CE_COR.*REPORT|AnnotationWriter.Create' src/CE.Tools.Civil3D || true
          echo '=== UTILITY PLANNING / PARCELS ==='
          grep -RniE -C 4 'Parcel|Erf|Cadastral|house connection|road reserve|manhole spacing|minimum cover|minimum slope|Water.*Demand|Sewer.*Analysis|Stormwater.*Analysis' src/CE.Tools.Civil3D || true
