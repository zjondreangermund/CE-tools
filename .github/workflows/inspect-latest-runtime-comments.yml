name: Inspect Latest Runtime Comments

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory utility and surface implementations
        shell: bash
        run: |
          echo '=== NETWORK/PARCEL/SURFACE FILES ==='
          find src/CE.Tools.Civil3D -maxdepth 1 -type f \( -iname '*network*' -o -iname '*parcel*' -o -iname '*surface*' -o -iname '*storm*' -o -iname '*water*' -o -iname '*sewer*' \) | sort
          echo '=== NETWORK/PARCEL COMMAND METHODS ==='
          for f in $(find src/CE.Tools.Civil3D -maxdepth 1 -type f \( -iname '*network*' -o -iname '*parcel*' -o -iname '*storm*' -o -iname '*water*' -o -iname '*sewer*' \)); do
            echo "--- $f"; grep -nE 'CommandMethod|network from|polylines|Parcel|manhole|cover|slope|demand' "$f" | head -120 || true; done
          echo '=== SURFACE REPAIR METHODS ==='
          grep -nE -C 5 'CommandMethod|spike|hole|repair|triangle|Delete|Add' src/CE.Tools.Civil3D/SurfaceSpikeHoleRepairCommands.cs | head -260 || true
          echo '=== PROJECT COORDINATION COMMANDS ==='
          grep -nE 'CommandMethod|MASTERXREF|PAGESETUP|SURVEYLOCATION|MAPLOCATION' src/CE.Tools.Civil3D/ProjectCoordinationCommands.cs || true
