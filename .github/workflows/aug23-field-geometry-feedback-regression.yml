name: August 23 Field Geometry Feedback
# Final-head regression is intentionally idempotent when the junction fix is already present.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August20GeometryFirstSewerCommands.cs'
      - 'src/CE.Tools.Civil3D/August21SafePolylineBreakEngine.cs'
      - 'scripts/Repair-August23-FieldGeometryFeedback-Civil3D2023.ps1'
      - 'scripts/Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
      - '.github/workflows/aug23-field-geometry-feedback-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/August20GeometryFirstSewerCommands.cs'
      - 'src/CE.Tools.Civil3D/August21SafePolylineBreakEngine.cs'
      - 'scripts/Repair-August23-FieldGeometryFeedback-Civil3D2023.ps1'
      - 'scripts/Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
      - '.github/workflows/aug23-field-geometry-feedback-regression.yml'

jobs:
  staged-field-geometry:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staged repository copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-tools-aug23-field-geometry'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination $stage -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'Directory.Build.targets') -Destination $stage -Force
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse field geometry repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:STAGE 'scripts\Repair-August23-FieldGeometryFeedback-Civil3D2023.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            throw (($errors | ForEach-Object { 'line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
          }

      - name: Validate staged source prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $geometry = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August20GeometryFirstSewerCommands.cs') -Raw
          if (-not $geometry.Contains('var used = new HashSet<int>();')) {
            throw 'Regression prerequisite missing: old one-use Road Reserve edge lock was not found.'
          }
          Write-Host 'Road Centreline staged source prerequisite reproduced; junction source may already contain the idempotent fix.' -ForegroundColor Green

      - name: Run final build boundary twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apply = Join-Path $env:STAGE 'scripts\Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
          & $apply -RepoRoot $env:STAGE
          & $apply -RepoRoot $env:STAGE

      - name: Verify field geometry fixes and safety boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $geometry = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August20GeometryFirstSewerCommands.cs') -Raw
          $break = Get-Content -LiteralPath (Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August21SafePolylineBreakEngine.cs') -Raw
          foreach ($marker in @(
            'var occupied = new Dictionary<int, List<double[]>>();',
            '.OrderBy(pair => pair.Width)',
            'firstIntervals.Add(new[] { candidate.OverlapLo, candidate.OverlapHi });',
            'secondIntervals.Add(new[] { candidate.OverlapLo, candidate.OverlapHi });')) {
            if (-not $geometry.Contains($marker)) { throw "Road Centreline field marker missing: $marker" }
          }
          if ($geometry.Contains('var used = new HashSet<int>();')) {
            throw 'Road Centreline still globally locks each cadastral edge after one match.'
          }
          foreach ($marker in @(
            'private const double JunctionSnapTolerance = 0.01;',
            'AddPlanVertexTouches(',
            'Math.Sqrt(dx * dx + dy * dy) > JunctionSnapTolerance',
            'GetClosestPointTo(candidate, false)',
            'VerifyReplacement(',
            'source.Erase();')) {
            if (-not $break.Contains($marker)) { throw "Break-at-junction field marker missing: $marker" }
          }
          $verify = $break.IndexOf('VerifyReplacement(',[StringComparison]::Ordinal)
          $erase = $break.IndexOf('source.Erase();',[StringComparison]::Ordinal)
          if ($verify -lt 0 -or $erase -le $verify) {
            throw 'Break-at-junction source erase is no longer ordered after replacement verification.'
          }
          Write-Host 'Road Centreline multi-gap pairing and tolerant T-junction analysis passed.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
