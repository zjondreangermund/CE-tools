name: Validate Final Comment Closure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    paths:
      - 'src/CE.Tools.Civil3D/**'
      - 'scripts/Inject-ProductionExpansion-Civil3D2023.ps1'
      - 'scripts/Inject-August10BehaviorFixes-Civil3D2023.ps1'
      - 'scripts/Inject-FinalAnnotationReview2-Civil3D2023.ps1'
      - 'scripts/Inject-FinalUtilityWorkflow-Civil3D2023.ps1'
      - 'scripts/Repair-CogoOverlap-Civil3D2023.ps1'
      - 'scripts/Repair-RoadStyleFallback-Civil3D2023.ps1'
      - 'scripts/Repair-BranchLabelRefresh-Civil3D2023.ps1'
      - 'scripts/Repair-MidblockRoutePlanner-Civil3D2023.ps1'
      - 'scripts/Repair-ProfileStyleAutoImport-Civil3D2023.ps1'
      - 'scripts/Repair-UtilityProfileIsolation-Civil3D2023.ps1'
      - 'scripts/Validate-August10CommentClosure.ps1'
      - 'scripts/Stage-Build-Install-Civil3D2023.ps1'
      - 'scripts/Stage-Build-Install-Civil3D2023-August20.ps1'
      - '.github/workflows/validate-final-comment-closure.yml'

permissions:
  contents: read

jobs:
  validate-staged-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current Civil 3D source integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = (Resolve-Path '.').ProviderPath
          $plugin = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\PluginEntry.cs'))
          $platform = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\PlatformProductionCommands.cs'))
          $route = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\RoutePlannerExpansionCommands.cs'))
          $bands = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\SewerLongSectionBandCommands.cs'))
          $profileMatch = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\ProfileViewPropertyMatchCommands.cs'))
          $flow = [System.IO.File]::ReadAllText((Join-Path $root 'src\CE.Tools.Civil3D\SewerFlowDirectionCommands.cs'))
          foreach ($marker in @('UniversalDynamicRefreshManager.Initialize();', 'RoadAlignmentNameSync.Initialize();')) {
            if (-not $plugin.Contains($marker)) { throw "Current startup integration is missing: $marker" }
          }
          if (-not $platform.Contains('PlatformDynamicRefreshManager.EnsureInitialized()')) {
            throw 'Platform refresh manager is missing from the current source.'
          }
          if (-not $route.Contains('"CE_MIDBLOCKSEWERPRODUCTION"')) {
            throw 'Current Midblock production command target is missing.'
          }

          # September 29 field comments: keep these four fixes in the live source.
          foreach ($marker in @(
            'Platform refresh is manual/on-demand only',
            'Intentionally no Application.Idle, ObjectModified, ObjectErased or')) {
            if (-not $platform.Contains($marker)) { throw "Platform refresh throttling regression: $marker" }
          }
          foreach ($forbidden in @(
            '_database.ObjectModified += Changed',
            '_database.ObjectErased += Erased',
            'active.SendStringToExecute("CE_PLATFORMREFRESH "')) {
            if ($platform.Contains($forbidden)) { throw "Platform refresh loop regression: $forbidden" }
          }

          foreach ($marker in @(
            'EnsureEveryNetworkBandSource(',
            'CountUnlinkedNetworkRows(',
            'item.DataSourceId = networkId',
            'view.Bands.SetTopBandItems',
            'view.Bands.SetBottomBandItems')) {
            if (-not $bands.Contains($marker)) { throw "Sewer all-band data-source regression: $marker" }
          }

          foreach ($marker in @(
            '"CE_PROFILEVIEWEDITMATCH"',
            '"_.EditGraphProperties',
            'CE_PROFILEVIEWEDITMATCHAPPLY',
            'ReadImpliedProfileViews(document)',
            'CopyBands(')) {
            if (-not $profileMatch.Contains($marker)) { throw "Edit-once/apply-all regression: $marker" }
          }

          foreach ($marker in @(
            '"CE_SEWFLOWTOOUTLET"',
            'DistanceFromOutlet(outletId, adjacency)',
            'FlowDirectionMethodType.StartToEnd',
            'FlowDirectionMethodType.EndToStart',
            'pipe.RuleSetStyleId == originalRule')) {
            if (-not $flow.Contains($marker)) { throw "Structure-sequence sewer-flow regression: $marker" }
          }

          Write-Host 'Current source integration and September 29 field comments passed without applying historical injectors.'

      - name: Simulate late Midblock recovery and verify final repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = (Resolve-Path '.').ProviderPath
          $route = Join-Path $root 'src\CE.Tools.Civil3D\RoutePlannerExpansionCommands.cs'
          $repair = Join-Path $root 'scripts\Repair-MidblockRoutePlanner-Civil3D2023.ps1'
          $stage20 = Join-Path $root 'scripts\Stage-Build-Install-Civil3D2023-August20.ps1'

          $text = [System.IO.File]::ReadAllText($route)
          if (-not $text.Contains('"CE_MIDBLOCKSEWERLAYOUT"')) {
            throw 'Regression setup failed: final Midblock target was not present before simulated recovery.'
          }
          $text = $text.Replace('"CE_MIDBLOCKSEWERLAYOUT"','"CE_MIDBLOCKSEWERPRODUCTION"')
          [System.IO.File]::WriteAllText($route,$text,[System.Text.UTF8Encoding]::new($false))

          & $repair -RepoRoot $root
          $repaired = [System.IO.File]::ReadAllText($route)
          if (-not $repaired.Contains('"CE_MIDBLOCKSEWERLAYOUT"')) {
            throw 'Late Midblock recovery regression: final command target was not restored.'
          }
          if ($repaired -match '(?i)new\s+DisciplineWorkflowAction\(\s*"[^"]*Midblock sewer route[^"]*"\s*,\s*"CE_MIDBLOCKSEWERPRODUCTION"') {
            throw 'Late Midblock recovery regression: retired command target remains.'
          }

          $stageText = [System.IO.File]::ReadAllText($stage20)
          foreach ($marker in @(
            'Reapplying final Midblock Route Planner handoff after late recovery repairs...',
            '$lateMidblockAnchor',
            '& $midblockRepair -RepoRoot $stageRoot')) {
            if (-not $stageText.Contains($marker)) {
              throw "August 20 post-sanitize Midblock stage guard missing: $marker"
            }
          }
          Write-Host 'Post-sanitize Midblock handoff regression passed.' -ForegroundColor Green

      - name: Check transformed source for conflict markers
        shell: pwsh
        run: |
          $bad = Get-ChildItem 'src\CE.Tools.Civil3D' -Filter '*.cs' -File |
            Select-String -Pattern '^(<<<<<<<|=======|>>>>>>>)' -List
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_.Path }
            throw 'Conflict markers remain in staged source.'
          }
          Write-Host 'Staged-source closure validation completed without conflict markers.' -ForegroundColor Green
