name: Apply Dynamic COGO Vertex Sewer Fix

on:
  push:
    branches:
      - agent/fix-dynamic-cogo-vertex-sewer-links
  pull_request:
    branches:
      - agent/fix-dynamic-cogo-vertex-sewer-links

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-dynamic-cogo-vertex-sewer-links
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair temporary patch matchers
        run: python3 scripts/Repair-DynamicPatchRegex.py

      - name: Apply source integration
        run: python3 scripts/Apply-DynamicCogoVertexSewerFix.py

      - name: Validate dynamic COGO vertex and sewer links
        run: python3 scripts/Validate-DynamicCogoVertexSewerLinks.py

      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Validate project style persistence and sewer labels
        run: python3 scripts/Validate-ProjectStylePersistenceAndSewerLabels.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse Civil 3D C# syntax
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/PluginEntry.cs \
                  src/CE.Tools.Civil3D/ProjectStyleCenterCommands.cs \
                  src/CE.Tools.Civil3D/VertexSettingOutCommands.cs \
                  src/CE.Tools.Civil3D/VertexSettingOutGeometry.cs \
                  src/CE.Tools.Civil3D/SurveyCoordinateWorkflowCommands.cs \
                  src/CE.Tools.Civil3D/CommentPresentationCommands.cs \
                  src/CE.Tools.Civil3D/CogoPointProjectStyleCommands.cs \
                  src/CE.Tools.Civil3D/SewerNetworkDynamicSequenceManager.cs
          if git diff --cached --quiet; then
            echo "No integration changes remain."
            exit 0
          fi
          git commit -m "Wire dynamic COGO vertex and sewer links"
          git push origin HEAD:agent/fix-dynamic-cogo-vertex-sewer-links
