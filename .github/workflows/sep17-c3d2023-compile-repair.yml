name: Sep17 Civil 3D 2023 compile repair

on:
  push:
    branches:
      - fix/sep17-c3d2023-compile

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Civil 3D 2023 compile blockers and stale repair templates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          changed = []

          def read_text(path: Path):
              try:
                  with path.open('r', encoding='utf-8', newline='') as fh:
                      return fh.read()
              except (UnicodeDecodeError, OSError):
                  return None

          def write_text(path: Path, text: str):
              with path.open('w', encoding='utf-8', newline='') as fh:
                  fh.write(text)
              changed.append(str(path))

          grading = Path('src/CE.Tools.Civil3D/August23PlatformDynamicGradingCommands.cs')
          road = Path('src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs')
          sewer = Path('src/CE.Tools.Civil3D/SewerProductionCommands.cs')

          # CS0266: SourceSnapshot.ColorIndex is Int16 while Civil 3D returns Int32.
          text = read_text(grading)
          if text is None:
              raise SystemExit(f'Unable to read {grading}')
          stale_color = 'ColorIndex = source.ColorIndex,'
          fixed_color = 'ColorIndex = (short)source.ColorIndex,'
          if stale_color in text:
              if text.count(stale_color) != 1:
                  raise SystemExit(f'Expected one SourceSnapshot ColorIndex blocker in {grading}, found {text.count(stale_color)}')
              text = text.replace(stale_color, fixed_color, 1)
              write_text(grading, text)
          elif fixed_color not in text:
              raise SystemExit(f'Expected SourceSnapshot ColorIndex assignment not found in {grading}')

          # CS1061: RecordGraphicsModified belongs to Entity, not DBObject.
          def patch_graphics(path: Path, variable: str):
              text = read_text(path)
              if text is None:
                  raise SystemExit(f'Unable to read {path}')
              marker = f'graphicsEntity.RecordGraphicsModified(true);'
              if marker in text:
                  return
              newline = '\r\n' if '\r\n' in text else '\n'
              pattern = re.compile(r'(?m)^([ \t]*)try \{ ' + re.escape(variable) + r'\.RecordGraphicsModified\(true\); \} catch \{ \}\r?$')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one DBObject RecordGraphicsModified blocker in {path}, found {len(matches)}')
              def repl(match):
                  indent = match.group(1)
                  return (
                      indent + 'try' + newline
                      + indent + '{' + newline
                      + indent + f'    Entity graphicsEntity = {variable} as Entity;' + newline
                      + indent + '    if (graphicsEntity != null)' + newline
                      + indent + '        graphicsEntity.RecordGraphicsModified(true);' + newline
                      + indent + '}' + newline
                      + indent + 'catch { }'
                  )
              text = pattern.sub(repl, text, count=1)
              write_text(path, text)

          patch_graphics(road, 'value')
          patch_graphics(sewer, 'view')

          # Prevent installer/finalizer scripts from reintroducing these exact blockers.
          scripts = Path('scripts')
          if scripts.exists():
              for path in scripts.rglob('*'):
                  if not path.is_file():
                      continue
                  text = read_text(path)
                  if text is None:
                      continue
                  new_text = text.replace(stale_color, fixed_color)
                  new_text = new_text.replace(
                      'try { value.RecordGraphicsModified(true); } catch { }',
                      'try { Entity graphicsEntity = value as Entity; if (graphicsEntity != null) graphicsEntity.RecordGraphicsModified(true); } catch { }')
                  new_text = new_text.replace(
                      'try { view.RecordGraphicsModified(true); } catch { }',
                      'try { Entity graphicsEntity = view as Entity; if (graphicsEntity != null) graphicsEntity.RecordGraphicsModified(true); } catch { }')
                  if new_text != text:
                      write_text(path, new_text)

          # Authoritative validation.
          errors = []
          grading_text = read_text(grading) or ''
          if stale_color in grading_text or fixed_color not in grading_text:
              errors.append(f'{grading}: SourceSnapshot ColorIndex assignment is not compile-safe')

          stale_graphics = re.compile(r'(?m)^\s*try \{ (?:value|view)\.RecordGraphicsModified\(true\); \} catch \{ \}\s*$')
          for path in (road, sewer):
              current = read_text(path) or ''
              if stale_graphics.search(current):
                  errors.append(f'{path}: DBObject RecordGraphicsModified call remains')
              if 'graphicsEntity.RecordGraphicsModified(true);' not in current:
                  errors.append(f'{path}: Entity graphics refresh call is missing')

          if scripts.exists():
              for path in scripts.rglob('*'):
                  if not path.is_file():
                      continue
                  text = read_text(path)
                  if text is None:
                      continue
                  if stale_color in text or stale_graphics.search(text):
                      errors.append(f'{path}: stale compile-blocker template remains')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)

          print('Civil 3D 2023 compile blockers patched/verified:')
          for item in changed:
              print(f'  - {item}')
          if not changed:
              print('  - source was already compile-safe')
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sep17-c3d2023-compile-repair.yml
          git add src/CE.Tools.Civil3D/August23PlatformDynamicGradingCommands.cs \
                  src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs \
                  src/CE.Tools.Civil3D/SewerProductionCommands.cs \
                  scripts
          git commit -m "Fix Civil 3D 2023 compile blockers"
          git push origin HEAD:fix/sep17-c3d2023-compile
