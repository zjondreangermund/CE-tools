name: Civil 3D 2023 build and release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Do not run every Validate-*.py file here. Several of the August field
      # validators intentionally describe the post-injection Civil 3D 2023
      # staging state. The Windows stage below applies those injectors/repairs
      # first and then executes its staged PowerShell validation gates.
      - name: Validate release pipeline metadata
        run: python3 scripts/Validate-ReleasePipeline.py

      - name: Validate stable source presentation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/Validate-AnnotationCommands.py
          python3 scripts/Validate-ReportPresentation.py
          python3 scripts/Validate-ProductionCentreCommandTargets.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run host-independent engineering tests
        run: dotnet run --project tests/CE.Tools.Core.Tests/CE.Tools.Core.Tests.csproj -c Release

  build-civil3d-2023:
    needs: source-validation
    runs-on: [self-hosted, Windows, X64, Civil3D2023]
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Stage, repair, validate, build and install Civil 3D 2023
        shell: powershell
        run: |
          # Use the same current staged pipeline as the field launcher.
          # Stage-Build-Install-Civil3D2023-August20.ps1 routes the preserved
          # August 18/19/20 pipeline through Build-Install-Civil3D2023-August20-Compat.ps1,
          # whose finalizers include the August 21 state/surface/graphics and
          # Platform/page-order/Multiple-Dimensions/Multi-Trim fixes before MSBuild.
          .\scripts\Stage-Build-Install-Civil3D2023-August20.ps1 -SourceRoot $PWD

      - name: Recreate exact versioned release package
        shell: powershell
        run: |
          .\scripts\New-CE-ToolsReleasePackage.ps1 -SourceCommit $env:GITHUB_SHA

      - name: Upload verified installer package
        uses: actions/upload-artifact@v4
        with:
          name: CE-Tools-Civil3D-2023-${{ github.sha }}
          path: artifacts/release/CE-Tools-V*-Civil3D-2023-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release/CE-Tools-V*-Civil3D-2023-*.zip
