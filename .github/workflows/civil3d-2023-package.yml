name: Civil 3D 2023 build and release package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run source regression gates
        shell: bash
        run: |
          set -euo pipefail
          for validator in scripts/Validate-*.py; do
            python3 "$validator"
          done

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run host-independent engineering tests
        run: dotnet run --project tests/CE.Tools.Core.Tests/CE.Tools.Core.Tests.csproj -c Release

  build-civil3d-2023:
    needs: source-validation
    runs-on: [self-hosted, Windows, X64, Civil3D2023]
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Build Civil 3D 2023 without installation
        shell: powershell
        run: |
          .\scripts\Build-Install-Civil3D2023-DotNet.ps1 `
            -Clean `
            -SkipInstall `
            -SourceCommit $env:GITHUB_SHA

      - name: Recreate exact versioned release package
        shell: powershell
        run: |
          .\scripts\New-CE-ToolsReleasePackage.ps1 -SourceCommit $env:GITHUB_SHA

      - name: Upload verified installer package
        uses: actions/upload-artifact@v4
        with:
          name: CE-Tools-Civil3D-2023-${{ github.sha }}
          path: artifacts/release/CE-Tools-V*-Civil3D-2023-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release/CE-Tools-V*-Civil3D-2023-*.zip
