name: August 23 Vertex Label Guard Preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - 'scripts/Repair-August23-VertexLabelGuardPreflight-Civil3D2023.ps1'
      - 'scripts/Run-August23-SettingOutCadFeedback-Civil3D2023.ps1'
      - 'scripts/Repair-August23-SettingOutCadFeedback-Civil3D2023.ps1'
      - 'scripts/Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
      - '.github/workflows/aug23-vertex-label-guard-preflight.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - 'scripts/Repair-August23-VertexLabelGuardPreflight-Civil3D2023.ps1'
      - 'scripts/Run-August23-SettingOutCadFeedback-Civil3D2023.ps1'
      - 'scripts/Repair-August23-SettingOutCadFeedback-Civil3D2023.ps1'
      - 'scripts/Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
      - '.github/workflows/aug23-vertex-label-guard-preflight.yml'

jobs:
  staged-vertex-label-guard:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staged repository copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-tools-aug23-vertex-label-guard'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination $stage -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'Directory.Build.targets') -Destination $stage -Force
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reproduce packaged Vertex source drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\VertexSettingOutCommands.cs'
          $text = [System.IO.File]::ReadAllText($path) -replace "`r?`n", "`r`n"
          $old = '                try { point.PointName = record.PointName; } catch { }' + "`r`n"
          if (-not $text.Contains($old.TrimEnd("`r","`n"))) {
            throw 'Raw Vertex created-COGO PointName assignment not found for staged regression.'
          }
          $text = $text.Replace($old,'')
          if ($text.Contains('try { point.PointName = record.PointName; } catch { }')) {
            throw 'Failed to reproduce packaged Vertex created-COGO PointName drift.'
          }
          if (-not $text.Contains('point.RawDescription = record.PointName;')) {
            throw 'Stable created-COGO RawDescription anchor is missing.'
          }
          [System.IO.File]::WriteAllText($path,$text,(New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'Tester-reported Vertex label-guard source drift reproduced.' -ForegroundColor Green

      - name: Parse preflight scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'Repair-August23-VertexLabelGuardPreflight-Civil3D2023.ps1',
            'Run-August23-SettingOutCadFeedback-Civil3D2023.ps1')) {
            $path = Join-Path $env:STAGE ('scripts\' + $name)
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw ($name + ': ' + (($errors | ForEach-Object { 'line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | '))
            }
          }

      - name: Run final build boundary twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apply = Join-Path $env:STAGE 'scripts\Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1'
          & $apply -RepoRoot $env:STAGE
          & $apply -RepoRoot $env:STAGE

      - name: Verify Vertex label guards and idempotence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\VertexSettingOutCommands.cs'
          $text = [System.IO.File]::ReadAllText($path)
          foreach ($marker in @(
            'private static void ResetCogoLabel(CivilCogoPoint point)',
            'ResetCogoLabel(point);',
            'ResetCogoLabel(cogo);',
            'SetDimensionDoubleOverride(dimension, "Dimasz", 3.0);',
            'SetDimensionDoubleOverride(dimension, "Dimtxt", 1.8);')) {
            if (-not $text.Contains($marker)) { throw "Vertex final marker missing: $marker" }
          }
          $createdCount = ([regex]::Matches($text,'ResetCogoLabel\(point\);')).Count
          $updatedCount = ([regex]::Matches($text,'ResetCogoLabel\(cogo\);')).Count
          if ($createdCount -ne 1) { throw "Expected one created-COGO reset call, found $createdCount." }
          if ($updatedCount -ne 1) { throw "Expected one updated-COGO reset call, found $updatedCount." }
          Write-Host 'Vertex created/updated COGO label guards are present exactly once after two finalizer passes.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
