name: CE Tools Master Items Phase 2

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply active comments
        shell: pwsh
        run: ./scripts/Invoke-Comments-Normalizer.ps1

      - name: Apply discipline comments
        shell: pwsh
        run: ./scripts/Apply-Comments-Discipline.ps1

      - name: Apply sewer quantity comments
        shell: pwsh
        run: ./scripts/Apply-Comments-Quantities.ps1

      - name: Apply road-production comments
        shell: pwsh
        run: ./scripts/Apply-Comments-Road.ps1

      - name: Apply Master Items Phase 1
        shell: pwsh
        run: ./scripts/Invoke-Master-Items-Phase1.ps1

      - name: Apply Master Items Phase 2
        shell: pwsh
        run: ./scripts/Apply-Master-Items-Phase2.ps1

      - name: Normalize Civil 3D compatibility
        shell: pwsh
        run: ./scripts/Apply-Civil3D-Compatibility.ps1

      - name: Validate Phase 1
        run: python3 scripts/Validate-MasterItemsPhase1.py

      - name: Validate road section schedules
        run: python3 scripts/Validate-RoadSectionSchedule.py

      - name: Validate network asset schedules
        run: python3 scripts/Validate-NetworkAssetSchedule.py

      - name: Validate Phase 2
        run: python3 scripts/Validate-MasterItemsPhase2.py

      - name: Validate unique AutoCAD command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Validate inherited source
        run: |
          python3 scripts/Validate-Comments-2026-07-25.py
          python3 scripts/Validate-DisciplineComments.py
          python3 scripts/Validate-SewerExcavation.py
          python3 scripts/Validate-RoadProduction.py
          python3 scripts/Validate-WorkflowRepairs.py
          python3 scripts/Validate-DynamicTypicalDetails.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run host-independent geometry tests
        run: dotnet run --project tests/CE.Tools.Core.Tests/CE.Tools.Core.Tests.csproj -c Release
