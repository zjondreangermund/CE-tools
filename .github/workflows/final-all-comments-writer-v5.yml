name: Final all comments integration v5

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/final-all-comments-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-all-comments-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final all-comments source patch
        run: python scripts/Apply-FinalAllCommentsCompletion-v5.py
      - name: Run final all-comments acceptance gate
        run: python scripts/Validate-FinalAllCommentsCompletion.py
      - name: Run command registry
        run: python scripts/Validate-UniqueCommands.py
      - name: Parse all Civil 3D C# source
        run: python scripts/Validate-CSharpSyntax.py
      - name: Diff check
        run: git diff --check
      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Complete final CE Tools comments"
          git push origin HEAD:agent/final-all-comments-completion
