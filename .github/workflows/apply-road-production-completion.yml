name: Apply Road Production Completion

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latest-runtime-design-comments
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply road production patch
        shell: bash
        run: |
          set +e
          output=$(python3 scripts/Apply-RoadProductionCompletion.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -q 'TargetSurfaceId'; then
            exit "$status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs')
          t=p.read_text(encoding='utf-8')
          marker='        internal ObjectId TargetSurfaceId { get; set; }'
          if 'internal string AssemblyName { get; set; }' not in t:
              if marker not in t: raise SystemExit('Road corridor options marker missing')
              t=t.replace(marker, marker+'\n        internal string AssemblyName { get; set; }',1)
          t=t.replace('CivilAssemblyResolver.GetAssemblyIds(civilDocument, transaction.Database)',
                      'CivilAssemblyResolver.GetAssemblyIds(civilDocument, AcApplication.DocumentManager.MdiActiveDocument.Database)')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate road completion markers
        shell: bash
        run: |
          grep -q 'RoadProductionSettings road = RoadProductionSettings.Read' src/CE.Tools.Civil3D/RoadProductionCommentCommands.cs
          grep -q 'TryCreateMissingBaselineAndRegion' src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs
          grep -q 'internal string AssemblyName' src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs
          grep -q 'CE_ROADSETTINGS' src/CE.Tools.Civil3D/PluginEntry.cs
          grep -q 'CE_FLVERTEXLABELS' src/CE.Tools.Civil3D/PluginEntry.cs
      - name: Validate runtime comments
        run: python3 scripts/Validate-LatestRuntimeDesignComments.py
      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py
      - name: Validate preservation
        run: python3 scripts/Validate-PreservedRegressionGate.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Parse all C# source
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .
      - name: Validate diff
        run: git diff --check
      - name: Commit road completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/RoadProductionCommentCommands.cs \
                  src/CE.Tools.Civil3D/RoadCorridorCompletionCommands.cs \
                  src/CE.Tools.Civil3D/FeatureProfileSurfaceCommentCommands.cs \
                  src/CE.Tools.Civil3D/PluginEntry.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add road-specific production settings and corridor completion"
          git push origin HEAD:agent/latest-runtime-design-comments
