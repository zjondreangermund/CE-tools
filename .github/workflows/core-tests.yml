name: CE Tools Core Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate report presentation source
        run: python3 scripts/Validate-ReportPresentation.py

      - name: Validate shared annotation source
        run: python3 scripts/Validate-AnnotationCommands.py

      - name: Validate Civil 3D 2023 V61 compile repairs
        run: python3 scripts/Validate-Civil3D2023CompileRepairs.py

      - name: Validate workflow repairs
        run: python3 scripts/Validate-WorkflowRepairs.py

      - name: Validate linked survey coordinate workflows
        run: python3 scripts/Validate-SurveyCoordinateWorkflows.py

      - name: Validate workflow command centre
        run: python3 scripts/Validate-WorkflowWindow.py

      - name: Validate user comment coverage
        run: python3 scripts/Validate-UserCommentCoverage.py

      - name: Validate versioned release and installer pipeline
        run: python3 scripts/Validate-ReleasePipeline.py

      - name: Validate discipline workflow and settings dialogs
        run: python3 scripts/Validate-DisciplineProductionDialogs.py

      - name: Validate visual workflow launchers
        run: python3 scripts/Validate-VisualWorkflowLaunchers.py

      - name: Validate Phase 1 source completion
        run: python3 scripts/Validate-PhaseOneCompletion.py

      - name: Validate linked BOQ and Excel export source
        run: python3 scripts/Validate-BillOfQuantities.py

      - name: Validate linked water and sewer cost estimate
        run: python3 scripts/Validate-WaterSewerCostEstimate.py

      - name: Validate shared linked-output refresh
        run: python3 scripts/Validate-RefreshAll.py

      - name: Validate dynamic sections and drawing production source
        run: python3 scripts/Validate-DynamicProduction.py

      - name: Validate unique AutoCAD command registry
        run: python3 scripts/Validate-CommandRegistry.py

      - name: Validate restored 380 plus command surface
        run: python3 scripts/Validate-RestoredCommandSurface.py

      - name: Validate polished ribbon and client-book source
        run: python3 scripts/Validate-PresentationClientBook.py

      - name: Validate installed runtime presentation repairs
        run: python3 scripts/Validate-RuntimePresentationRepairs.py

      - name: Validate supplied Civil 3D project style sources
        run: python3 scripts/Validate-ProjectStyleSources.py

      - name: Validate Civil style catalogue and sewer labels
        run: python3 scripts/Validate-CivilStyleCatalogueAndSewerLabels.py

      - name: Validate sewer project and production popups
        run: python3 scripts/Validate-SewerProjectProductionPopups.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse Civil 3D C# syntax
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .

      - name: Run geometry tests
        run: dotnet run --project tests/CE.Tools.Core.Tests/CE.Tools.Core.Tests.csproj -c Release
