name: August 24 Final Compile Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'Directory.Build.targets'
      - 'scripts/Repair-August24-FinalCompileCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August24-DynamicGridCivilSurfaceCompileFix-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'src/CE.Tools.Civil3D/MultiBoundaryEditCommands.cs'
      - 'src/CE.Tools.Civil3D/MultiDimensionCommands.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug24-final-compile-compatibility-regression.yml'
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.targets'
      - 'scripts/Repair-August24-FinalCompileCompatibility-Civil3D2023.ps1'
      - 'scripts/Repair-August24-DynamicGridCivilSurfaceCompileFix-Civil3D2023.ps1'
      - 'src/CE.Tools.Civil3D/August18DynamicGridSettingOutCommands.cs'
      - 'src/CE.Tools.Civil3D/MultiBoundaryEditCommands.cs'
      - 'src/CE.Tools.Civil3D/MultiDimensionCommands.cs'
      - 'src/CE.Tools.Civil3D/VertexSettingOutCommands.cs'
      - '.github/workflows/aug24-final-compile-compatibility-regression.yml'

jobs:
  staged-final-compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create staged repository copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ce-tools-aug24-final-compile'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Destination $stage -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination $stage -Force
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply existing final staged boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0
          & (Join-Path $env:STAGE 'scripts\Apply-August21-CrossDisciplineFatalSafety-BeforeBuild.ps1') -RepoRoot $env:STAGE
          $global:LASTEXITCODE = 0
          & (Join-Path $env:STAGE 'scripts\Repair-August23-PlatformDynamicGrading-Civil3D2023.ps1') -RepoRoot $env:STAGE
          $global:LASTEXITCODE = 0
          & (Join-Path $env:STAGE 'scripts\Repair-August24-DynamicGridCivilSurfaceCompileFix-Civil3D2023.ps1') -RepoRoot $env:STAGE

      - name: Reproduce reported semantic compile drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $gridPath = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\August18DynamicGridSettingOutCommands.cs'
          $grid = [System.IO.File]::ReadAllText($gridPath) -replace "`r?`n", "`r`n"
          $grid = $grid.Replace('ReadSurfaceNames(document.Database, civil)', 'ReadGridSurfaceNames(document.Database, civil)')
          $grid = [regex]::Replace(
            $grid,
            '(?m)^(?<indent>[ \t]*)PopulateTable\(document\.Database, table, records, link\);',
            '${indent}PopulateTable(document.Database, transaction, table, records, link, sources);')
          $surfaceDecl = '            List<string> surfaceChoices = ReadGridSurfaceNames(document.Database, civil);'
          $decl = $grid.IndexOf($surfaceDecl,[StringComparison]::Ordinal)
          if ($decl -ge 0) {
            $lineEnd = $grid.IndexOf("`r`n",$decl,[StringComparison]::Ordinal)
            if ($lineEnd -ge 0) {
              $lineEnd += 2
              $line = $grid.Substring($decl,$lineEnd-$decl)
              $grid = $grid.Remove($decl,$lineEnd-$decl)
              $settings = $grid.IndexOf('            var settings = new ProductionSettingsDialogModel(',[StringComparison]::Ordinal)
              if ($settings -lt 0) { throw 'Grid settings marker missing while reproducing declaration drift.' }
              $grid = $grid.Insert($settings,$line)
            }
          }

          # Reproduce the tester's stronger staged ordering: an already-inserted Grid
          # control references surfaceChoices before the historical source-selection
          # guard where the previous compatibility pass placed the declaration.
          $activeGuard = '            if (document == null || civil == null) return;'
          $active = $grid.IndexOf($activeGuard,[StringComparison]::Ordinal)
          if ($active -lt 0) { throw 'Grid active-document guard missing while reproducing early use.' }
          $earlyUse = "`r`n            string[] stagedEarlySurfaceChoices = surfaceChoices.ToArray(); // regression-only early staged use"
          $grid = $grid.Insert($active + $activeGuard.Length,$earlyUse)
          [System.IO.File]::WriteAllText($gridPath,$grid,$utf8)

          $dimPath = Join-Path $env:STAGE 'src\CE.Tools.Civil3D\MultiDimensionCommands.cs'
          $dim = [System.IO.File]::ReadAllText($dimPath) -replace "`r?`n", "`r`n"
          $dim = $dim.Replace(
            'DimensionOpenPolylineChain(document, selection, requestedStyle);',
            'DimensionOpenPolylineChain(document, selection, requestedStyle, measurementFactor);')
          [System.IO.File]::WriteAllText($dimPath,$dim,$utf8)

          Write-Host 'Reported final semantic compile drift reproduced.' -ForegroundColor Green

      - name: Parse and run final compatibility twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repair = Join-Path $env:STAGE 'scripts\Repair-August24-FinalCompileCompatibility-Civil3D2023.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($repair,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            throw (($errors | ForEach-Object { 'line ' + $_.Extent.StartLineNumber + ': ' + $_.Message }) -join ' | ')
          }
          & $repair -RepoRoot $env:STAGE
          & $repair -RepoRoot $env:STAGE

      - name: Verify reported compiler errors are normalized
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:STAGE 'src\CE.Tools.Civil3D'

          $grid = [System.IO.File]::ReadAllText((Join-Path $src 'August18DynamicGridSettingOutCommands.cs')) -replace "`r?`n", "`r`n"
          if ($grid.Contains('ReadGridSurfaceNames(')) { throw 'CS0103 ReadGridSurfaceNames state survived.' }
          $createMarker = '        public void CreateDynamicGrid()'
          $nextMarker = '        [CommandMethod('
          $createStart = $grid.IndexOf($createMarker,[StringComparison]::Ordinal)
          $createEnd = $grid.IndexOf($nextMarker,$createStart + $createMarker.Length,[StringComparison]::Ordinal)
          if ($createStart -lt 0 -or $createEnd -lt 0) { throw 'CreateDynamicGrid scope missing during verification.' }
          $create = $grid.Substring($createStart,$createEnd-$createStart)
          $decl = $create.IndexOf('List<string> surfaceChoices = ReadSurfaceNames(document.Database, civil);',[StringComparison]::Ordinal)
          $use = $create.IndexOf('surfaceChoices.ToArray()',[StringComparison]::Ordinal)
          if ($decl -lt 0 -or ($use -ge 0 -and $decl -gt $use)) { throw 'CS0841 surfaceChoices declaration-order state survived inside CreateDynamicGrid.' }
          $populate = ([regex]::Matches($grid,'(?m)^[ \t]*PopulateTable\(document\.Database, table, records, link\);')).Count
          if ($populate -ne 2) { throw "CS1501 Grid PopulateTable state survived; canonical=$populate." }

          $boundary = [System.IO.File]::ReadAllText((Join-Path $src 'MultiBoundaryEditCommands.cs'))
          if ($boundary.Contains('bool keep = keepInside ? inside : !inside;')) { throw 'CS0136 MultiBoundary keep collision survived.' }

          $dim = [System.IO.File]::ReadAllText((Join-Path $src 'MultiDimensionCommands.cs'))
          if ($dim.Contains('DimensionOpenPolylineChain(document, selection, requestedStyle,')) { throw 'CS1501 MultiDimension four-argument chain call survived.' }
          if (-not $dim.Contains('DimensionOpenPolylineChain(document, selection, requestedStyle);')) { throw 'Canonical MultiDimension chain call missing.' }

          $vertex = [System.IO.File]::ReadAllText((Join-Path $src 'VertexSettingOutCommands.cs'))
          if ($vertex.Contains('.GetBlockTableRecordId(')) { throw 'CS1061 unsupported Database.GetBlockTableRecordId survived.' }
          if (-not $vertex.Contains('private static ObjectId ResolveDimensionArrowBlock(')) { throw 'Vertex arrow lookup helper missing.' }

          Write-Host 'All tester-reported semantic compiler states normalized.' -ForegroundColor Green

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse final staged Civil 3D C# syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project (Join-Path $env:STAGE 'tests\CE.Tools.CSharpSyntax.Tests\CE.Tools.CSharpSyntax.Tests.csproj') -c Release -- $env:STAGE
