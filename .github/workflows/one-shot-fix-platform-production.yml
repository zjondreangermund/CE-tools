name: One-shot platform production compile repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-platform-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair platform source and validate command names
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/CE.Tools.Civil3D/PlatformProductionCommands.cs')
          text = path.read_text(encoding='utf-8')
          old = '                HashSet<string> names = ReadFeatureLineNames(modelSpace, transaction);'
          new = '                var names = new HashSet<string>(ReadFeatureLineNames(modelSpace, transaction), StringComparer.OrdinalIgnoreCase);'
          if old not in text:
              raise SystemExit('Expected platform HashSet repair marker was not found.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          # Lightweight duplicate command guard across the complete Civil 3D source.
          import re
          commands = {}
          duplicates = []
          for source in Path('src/CE.Tools.Civil3D').glob('*.cs'):
              data = source.read_text(encoding='utf-8', errors='replace')
              for match in re.finditer(r'\[CommandMethod\([^\]]*?"(CE_[A-Z0-9_]+)"', data, re.S):
                  name = match.group(1)
                  previous = commands.get(name)
                  if previous and previous != source.name:
                      duplicates.append((name, previous, source.name))
                  commands[name] = source.name
          if duplicates:
              raise SystemExit('Duplicate CE commands: ' + repr(duplicates[:20]))
      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-fix-platform-production.yml
          git config user.name "CE Tools Agent"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "Fix platform production compile collection conversion"
          git push
