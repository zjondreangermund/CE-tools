name: Apply Surface Network Data Fixes

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/latest-runtime-design-comments
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply surface and network data fixes
        run: python3 scripts/Apply-SurfaceNetworkDataFixes.py
      - name: Validate latest runtime/design comments
        run: python3 scripts/Validate-LatestRuntimeDesignComments.py
      - name: Validate command registry
        run: python3 scripts/Validate-CommandRegistry.py
      - name: Validate preservation
        run: python3 scripts/Validate-PreservedRegressionGate.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Parse all C# source
        run: dotnet run --project tests/CE.Tools.CSharpSyntax.Tests/CE.Tools.CSharpSyntax.Tests.csproj -c Release -- .
      - name: Validate diff
        run: git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CE.Tools.Civil3D/SurfaceSpikeHoleRepairCommands.cs \
                  src/CE.Tools.Civil3D/NetworkAssetScheduleCommands.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix surface repair fallback and network pipe data"
          git push origin HEAD:agent/latest-runtime-design-comments
